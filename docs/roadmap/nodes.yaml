- id: research-lkl-nommu
  title: Revive LKL or nommu UML
  track: research
  kind: experiment
  state: abandoned
  outcome: dead-end
  evidence:
  - docs/adr/0001-gvisor-sentry-as-the-base.md
  verdict_quote: Real Linux kernel, but nommu mode has no `fork()` and no memory protection between processes; LKL dropped Windows hosts in 2020; nommu UML is unmerged (v14, Feb 2026).
  headline: ''
  depends_on: []
  replaced_by: []
  lane: none
  start: '2026-11-26'
  end: '2026-11-26'
  folded: []
  overview: false
  plain: 'Running the real Linux kernel as a library was rejected: without memory management it cannot fork, and its Windows support is gone.'
- id: research-unkernel
  title: Build on unkernel
  track: research
  kind: experiment
  state: abandoned
  outcome: dead-end
  evidence:
  - docs/adr/0001-gvisor-sentry-as-the-base.md
  verdict_quote: Runs Linux compiled to wasm off Linux today, but guest code is always emulated (aarch64 only), so it cannot run x86 user code natively.
  headline: ''
  depends_on: []
  replaced_by: []
  lane: none
  start: '2026-11-26'
  end: '2026-11-26'
  folded: []
  overview: false
  plain: Linux compiled to WebAssembly runs anywhere, but it always emulates the programs, so it cannot reach native speed.
- id: research-flinux-translation
  title: Translate syscalls like flinux
  track: research
  kind: experiment
  state: abandoned
  outcome: dead-end
  evidence:
  - docs/adr/0001-gvisor-sentry-as-the-base.md
  verdict_quote: Translates Linux syscalls onto Windows calls; has no namespaces, cgroups or overlay, so it cannot host a container engine without writing a kernel.
  headline: ''
  depends_on: []
  replaced_by: []
  lane: none
  start: '2026-11-26'
  end: '2026-11-26'
  folded: []
  overview: false
  plain: Mapping each Linux call onto a Windows call cannot provide what containers need, such as namespaces and cgroups.
- id: research-qemu-emulation
  title: QEMU software emulation
  track: research
  kind: experiment
  state: abandoned
  outcome: dead-end
  evidence:
  - docs/adr/0001-gvisor-sentry-as-the-base.md
  verdict_quote: Works today, but software emulation of the whole machine is several times slower; WHPX needs a one-time admin step.
  headline: ''
  depends_on: []
  replaced_by: []
  lane: none
  start: '2026-11-26'
  end: '2026-11-26'
  folded: []
  overview: false
  plain: Emulating a whole computer in software works today but is several times slower; it stays only as a stopgap.
