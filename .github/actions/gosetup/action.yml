name: gosetup
description: Go toolchain plus the Go build and module caches (restored from the last saved one).
inputs:
  save: {description: "save the caches at the end of the job (only the ci bin job does)", default: "false"}
runs:
  using: composite
  steps:
    - uses: actions/setup-go@v5
      with: {go-version-file: go.mod, cache: false}
    - id: d
      shell: bash
      run: |
        echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
        echo "mod=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
    - if: inputs.save == 'true'
      uses: actions/cache@v4
      with:
        path: |
          ${{ steps.d.outputs.build }}
          ${{ steps.d.outputs.mod }}
        key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
        restore-keys: go-${{ runner.os }}-${{ hashFiles('go.sum') }}-
    - if: inputs.save != 'true'
      uses: actions/cache/restore@v4
      with:
        path: |
          ${{ steps.d.outputs.build }}
          ${{ steps.d.outputs.mod }}
        key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}-none
        restore-keys: go-${{ runner.os }}-${{ hashFiles('go.sum') }}-
