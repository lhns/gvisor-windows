name: windows-fs

on:
  push:
  workflow_dispatch:

env:
  CGO_ENABLED: "0"

jobs:
  directfs:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Host layer (winhost) tests
        shell: bash
        run: |
          set +e
          go test -p 1 -count=1 -v -timeout 600s ./pkg/sentry/fsimpl/gofer/winhost/ > winhost.log 2>&1
          rc=$?
          grep -E "^(\s*--- |FAIL|ok|panic|fatal)|_test.go:[0-9]+:" winhost.log | head -200
          exit $rc
      - name: Gofer backend through the VFS layer
        if: always()
        shell: bash
        run: |
          set +e
          go test -p 1 -count=1 -v -timeout 600s -run 'TestVFS' ./pkg/sentry/fsimpl/gofer/ > gofer.log 2>&1
          rc=$?
          grep -E "^(\s*--- |FAIL|ok|panic|fatal)|_test.go:[0-9]+:|^goroutine|\.go:[0-9]+ " gofer.log | head -120
          exit $rc
      - name: The same tests as a standard user (deletes and renames in the user's own folders)
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force C:\ci\bin, C:\ci\probe | Out-Null
          go test -c -o C:\ci\bin\winhost.test.exe ./pkg/sentry/fsimpl/gofer/winhost
          go test -c -o C:\ci\bin\gofer.test.exe ./pkg/sentry/fsimpl/gofer
          & tools/windows/ci/run-as-standard-user.ps1 -Program C:\ci\bin\winhost.test.exe -Arguments '-test.v','-test.count=1','-test.timeout=600s' -GrantPath C:\ci\bin -WritablePath C:\ci\probe -Environment @{GVISOR_PROBE_DIR='C:\ci\probe'; TEMP='C:\ci\probe'; TMP='C:\ci\probe'} -TimeoutSeconds 900
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & tools/windows/ci/run-as-standard-user.ps1 -Program C:\ci\bin\gofer.test.exe -Arguments '-test.v','-test.count=1','-test.timeout=900s','-test.run','TestVFS' -GrantPath C:\ci\bin -TimeoutSeconds 1200
          exit $LASTEXITCODE
