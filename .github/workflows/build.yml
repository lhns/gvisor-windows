name: build

on:
  push:
    branches: [windows]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  triggers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github
      # Workers don't edit `on:` blocks; a push trigger on another branch starts every suite on every push.
      - name: A push trigger may only name the branch windows
        run: |
          python3 - <<'PY'
          import glob, sys, yaml
          bad = []
          for f in sorted(glob.glob('.github/workflows/*.yml')):
              d = yaml.safe_load(open(f))
              on = d.get('on', d.get(True)) or {}
              if isinstance(on, str): on = {on: None}
              elif isinstance(on, list): on = {k: None for k in on}
              if 'push' in on and (on['push'] or {}).get('branches') != ['windows']:
                  bad.append(f)
          if bad:
              print('push: needs branches: [windows] in', ', '.join(bad))
              sys.exit(1)
          PY
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Sandbox for Windows
        run: GOOS=windows CGO_ENABLED=0 go build -p 2 ./runsc/boot/...
      - name: runsc for Linux
        run: GOOS=linux CGO_ENABLED=0 go build -p 2 ./runsc/...
  upstream-dryrun:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: bash .github/scripts/upstream-merge.sh
        env:
          DRY_RUN: '1'
          BASE_BRANCH: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
