# Stress for the create/lookup races seen in the Podman acceptance (docs/results/5-podman-windows.md, fifth round).
name: fs-flakes
on:
  workflow_dispatch:
    inputs:
      iters: {description: iterations per worker, default: "600"}
      workers: {description: parallel mount namespaces, default: "12"}
      reps: {description: repetitions, default: "3"}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  guests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {sparse-checkout: test/guests}
      - run: |
          mkdir -p out
          gcc -static -no-pie -O1 -Wall -o out/fsstress test/guests/fsstress.c
          gcc -static -no-pie -O1 -Wall -o out/aptrename test/guests/aptrename.c
          gcc -static -no-pie -O1 -Wall -o out/mountkeep test/guests/mountkeep.c
          gcc -static -no-pie -O1 -Wall -o out/devnull test/guests/devnull.c
          gcc -static -no-pie -O1 -Wall -o out/ovlsub test/guests/ovlsub.c
          gcc -static -no-pie -O1 -Wall -o out/ovlopaque test/guests/ovlopaque.c
      - uses: actions/upload-artifact@v4
        with: {name: fsstress-guest, path: out}
  stress:
    needs: guests
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [native, rewrite, rewrite-ud2]
    env:
      WINSTUB_FSMODE: ${{ matrix.mode == 'native' && 'native' || 'rewrite' }}
      FSUD2: ${{ matrix.mode == 'rewrite-ud2' && '1' || '' }}
      WINSTUB_KEEP_AVX512: ${{ matrix.mode != 'native' && '1' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod, cache: false}
      - uses: actions/download-artifact@v4
        with: {name: fsstress-guest, path: guests}
      - name: Build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force C:\ci\bin | Out-Null
          go build -p 2 -o C:\ci\bin\runsc.exe ./runsc
          go build -o C:\ci\bin\runsctest.exe ./tools/windows/runsctest
          $r = 'C:\ci\work\rootfs'
          foreach ($d in 'bin','etc','proc','dev','tmp') { New-Item -ItemType Directory -Force "$r\$d" | Out-Null }
          Copy-Item guests\fsstress "$r\bin\fsstress"
          Copy-Item guests\aptrename "$r\bin\aptrename"
          Copy-Item guests\mountkeep "$r\bin\mountkeep"
          Copy-Item guests\devnull "$r\bin\devnull"
          Copy-Item guests\ovlsub "$r\bin\ovlsub"
      - name: The text of the static guest patched in pieces (seams)
        if: env.FSUD2 == ''
        continue-on-error: true
        shell: pwsh
        run: |
          go test -c -o C:\ci\bin\winstub.test.exe ./pkg/sentry/platform/winstub
          $env:FSSEAM_ELF = (Resolve-Path guests\aptrename).Path
          Push-Location pkg/sentry/platform/winstub
          $a = @(('-test.run=^TestFSSeamBinary'+[char]36), '-test.v=true', '-test.timeout=10m'); & C:\ci\bin\winstub.test.exe @a 2>&1 | Select-String -NotMatch 'winstub: (imm site|reloc site|%fs ud2|text |edges|wx)' | Select-Object -Last 60
          Pop-Location
      - name: A mount on a host folder survives changes from Windows
        shell: pwsh
        run: |
          & tools/windows/ci/run-as-standard-user.ps1 `
            -Program C:\ci\bin\runsctest.exe `
            -Arguments @('-fsmode', $env:WINSTUB_FSMODE, $(if ($env:FSUD2) { '-fsud2' } else { '-fsmode=' + $env:WINSTUB_FSMODE }), '-runsc','C:\ci\bin\runsc.exe','-rootfs','C:\ci\work\rootfs','-work','C:\ci\work\std-keep','-only','mountkeep','-timeout','300s') `
            -GrantPath C:\ci\bin -WritablePath C:\ci\work -TimeoutSeconds 600
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Overlay on a host folder, whiteout and RemoveAll (c/storage probe)
        shell: pwsh
        run: |
          & tools/windows/ci/run-as-standard-user.ps1 `
            -Program C:\ci\bin\runsctest.exe `
            -Arguments @('-fsmode', $env:WINSTUB_FSMODE, '-runsc','C:\ci\bin\runsc.exe','-rootfs','C:\ci\work\rootfs','-work','C:\ci\work\std-ovl','-only','ovlsub','-timeout','300s') `
            -GrantPath C:\ci\bin -WritablePath C:\ci\work -TimeoutSeconds 600
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Overlay on a host folder, opaque flag not copied up (c/storage native-diff probe)
        shell: pwsh
        run: |
          & tools/windows/ci/run-as-standard-user.ps1 `
            -Program C:\ciinunsctest.exe `
            -Arguments @('-fsmode', $env:WINSTUB_FSMODE, '-runsc','C:\ciinunsc.exe','-rootfs','C:\ci\workootfs','-work','C:\ci\work\std-opq','-only','ovlopaque','-timeout','300s') `
            -GrantPath C:\ciin -WritablePath C:\ci\work -TimeoutSeconds 600
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Unprivileged /dev/null and dpkg's symlink pattern as a standard user
        shell: pwsh
        run: |
          $fail = 0
          for ($i = 1; $i -le 3; $i++) {
            & tools/windows/ci/run-as-standard-user.ps1 `
              -Program C:\ci\bin\runsctest.exe `
              -Arguments @('-fsmode', $env:WINSTUB_FSMODE, '-runsc','C:\ci\bin\runsc.exe','-rootfs','C:\ci\work\rootfs','-work',"C:\ci\work\std-dn$i",'-only','devnull','-stress-iters','1000','-timeout','600s') `
              -GrantPath C:\ci\bin -WritablePath C:\ci\work -TimeoutSeconds 900
            if ($LASTEXITCODE -ne 0) { $fail++ }
          }
          Write-Host "devnull repetitions failed: $fail of 3"
          if ($fail) { exit 1 }
      - name: apt rename pattern as a standard user
        shell: pwsh
        run: |
          $fail = 0
          for ($i = 1; $i -le 3; $i++) {
            & tools/windows/ci/run-as-standard-user.ps1 `
              -Program C:\ci\bin\runsctest.exe `
              -Arguments @('-fsmode', $env:WINSTUB_FSMODE, $(if ($env:FSUD2) { '-fsud2' } else { '-fsmode=' + $env:WINSTUB_FSMODE }), '-runsc','C:\ci\bin\runsc.exe','-rootfs','C:\ci\work\rootfs','-work',"C:\ci\work\std-apt$i",'-only','aptrename','-fslog','-stress-iters','200','-timeout','600s') `
              -GrantPath C:\ci\bin -WritablePath C:\ci\work -TimeoutSeconds 900
            if ($LASTEXITCODE -ne 0) { $fail++ }
          }
          Write-Host "apt repetitions failed: $fail of 3"
          if ($fail) { exit 1 }
      - name: apt rename pattern under CPU load (the guest runs slower than alone)
        if: env.FSUD2 == ''
        continue-on-error: true
        shell: pwsh
        run: |
          $spin = 1..8 | ForEach-Object { Start-Process pwsh -ArgumentList '-NoProfile','-Command','while ($true) { }' -PassThru }
          $fail = 0
          for ($i = 1; $i -le 2; $i++) {
            & tools/windows/ci/run-as-standard-user.ps1 `
              -Program C:\ci\bin\runsctest.exe `
              -Arguments @('-fsmode', $env:WINSTUB_FSMODE, '-runsc','C:\ci\bin\runsc.exe','-rootfs','C:\ci\work\rootfs','-work',"C:\ci\work\std-load$i",'-only','aptrename','-stress-iters','200','-timeout','900s') `
              -GrantPath C:\ci\bin -WritablePath C:\ci\work -TimeoutSeconds 1200
            if ($LASTEXITCODE -ne 0) { $fail++ }
          }
          $spin | Stop-Process -Force
          Write-Host "LOAD apt repetitions failed: $fail of 2"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fs-flakes-logs-${{ matrix.mode }}
          path: |
            C:\ci\work\std-apt*\logs
            C:\ci\work\std-dn*\logs
          if-no-files-found: ignore
      - name: Stress as a standard user
        shell: pwsh
        run: |
          $iters = if ($env:IT) { $env:IT } else { '600' }; $workers = if ($env:WK) { $env:WK } else { '12' }; $reps = if ($env:RP) { [int]$env:RP } else { 3 }
          # Every %fs instruction goes through the debugger in the ud2 leg: a quarter of the iterations keeps it a
          # correctness check within the deadline (600 took about 11 min per phase, ci run 46016193396).
          if ($env:FSUD2) { $iters = [string][math]::Max(1, [math]::Floor([int]$iters / 4)) }
          $fail = 0
          for ($i = 1; $i -le $reps; $i++) {
            & tools/windows/ci/run-as-standard-user.ps1 `
              -Program C:\ci\bin\runsctest.exe `
              -Arguments @('-fsmode', $env:WINSTUB_FSMODE, $(if ($env:FSUD2) { '-fsud2' } else { '-fsmode=' + $env:WINSTUB_FSMODE }), '-runsc','C:\ci\bin\runsc.exe','-rootfs','C:\ci\work\rootfs','-work',"C:\ci\work\std-stress$i",'-only','fsstress','-stress-iters',$iters,'-stress-workers',$workers,'-timeout','900s') `
              -GrantPath C:\ci\bin -WritablePath C:\ci\work -TimeoutSeconds 1800
            if ($LASTEXITCODE -ne 0) { $fail++ }
          }
          Write-Host "repetitions failed: $fail of $reps"
          if ($fail) { exit 1 }
        env:
          IT: ${{ inputs.iters }}
          WK: ${{ inputs.workers }}
          RP: ${{ inputs.reps }}
