# Profile of the slow small-file and exec path of the Sentry on Windows (docs/results/1i-profile.md).
name: windows-profile
on:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rootfs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: test/guests
      - name: Root filesystem tar
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq busybox-static
          R=root; mkdir -p $R/bin $R/t $R/data
          cp /bin/busybox $R/bin/busybox
          for a in sh true tar mkdir rm cat; do ln -s busybox $R/bin/$a; done
          cp test/guests/t/loop.sh $R/t/
          # 20k small files in 2000 directories, like the Phase 0 tarball
          mkdir -p src; for d in $(seq 1 2000); do mkdir -p src/d$d; for f in $(seq 1 10); do head -c 1024 /dev/urandom > src/d$d/f$f; done; done
          tar -C src -cf $R/data/big.tar .
          mkdir -p small; for d in $(seq 1 100); do mkdir -p small/d$d; for f in $(seq 1 10); do head -c 1024 /dev/urandom > small/d$d/f$f; done; done
          tar -C small -cf $R/data/small.tar .
          tar -C $R -cf rootfs.tar .
          ls -l rootfs.tar
      - uses: actions/upload-artifact@v4
        with: {name: rootfs, path: rootfs.tar, compression-level: 0}
  profile:
    needs: rootfs
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod, cache: false}
      - uses: actions/download-artifact@v4
        with: {name: rootfs, path: dl}
      - name: Build
        shell: pwsh
        run: go build -p 2 -o sentryguest.exe ./tools/windows/sentryguest
      - name: Runs
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          $g = @('-tar=dl/rootfs.tar', '-timeout=600s')
          function Run($name, $extra, $guest) {
            "===== $name" | Tee-Object -Append out/runs.txt
            & ./sentryguest.exe @g @extra @guest 2>&1 | Tee-Object -Append out/runs.txt | Select-String -Pattern 'sentryguest: exit|PROFSTATS|FAIL' | ForEach-Object { $_.Line }
          }
          $untar = @('/bin/busybox', 'sh', '-c', 'mkdir /x; tar -xf /data/big.tar -C /x')
          $loop = @('/bin/busybox', 'sh', '/t/loop.sh', '100')
          Run 'noop' @() @('/bin/busybox', 'true')
          Run 'untar' @() $untar
          Run 'forkexec100' @() $loop
          Run 'forkexec100+aspool2' @('-aspool=2') $loop
          Run 'forkexec100+aspool4' @('-aspool=4') $loop
          Run 'untar+profstats' @('-profstats') $untar
          Run 'forkexec100+profstats' @('-profstats') $loop
          Run 'untar+cpuprofile' @('-cpuprofile=out/untar.pprof') $untar
          Run 'forkexec100+cpuprofile' @('-cpuprofile=out/forkexec.pprof') $loop
          $ErrorActionPreference = 'Continue'
          foreach ($p in 'untar', 'forkexec') {
            "===== pprof $p (flat)" | Tee-Object -Append out/pprof.txt
            go tool pprof -top -nodecount=45 sentryguest.exe out/$p.pprof 2>&1 | Tee-Object -Append out/pprof.txt | Select-Object -First 60
            "===== pprof $p (cum)" | Tee-Object -Append out/pprof.txt
            go tool pprof -top -cum -nodecount=45 sentryguest.exe out/$p.pprof 2>&1 | Tee-Object -Append out/pprof.txt | Select-Object -First 60
          }
          exit 0
      - name: Platform trace
        continue-on-error: true
        shell: pwsh
        run: |
          $env:WINSTUB_TRACE = '1'
          & ./sentryguest.exe '-tar=dl/rootfs.tar' -timeout=300s /bin/busybox sh -c 'mkdir /x; tar -xf /data/small.tar -C /x' *> out/trace-untar-small.txt
          & ./sentryguest.exe '-tar=dl/rootfs.tar' -timeout=300s /bin/busybox sh /t/loop.sh 10 *> out/trace-forkexec10.txt
          foreach ($f in 'trace-untar-small', 'trace-forkexec10') {
            $t = Get-Content out/$f.txt
            "== ${f}: $($t.Count) lines"
            $t | ForEach-Object { if ($_ -match '^trace +[\d.]+ms (debug event \d+|exception \S+|[a-z]+:? [a-z]+)') { $Matches[1] -replace '\d+(x[0-9a-f]+)?', 'N' } } | Group-Object | Sort-Object Count -Descending | Select-Object -First 25 | ForEach-Object { "{0,8} {1}" -f $_.Count, $_.Name }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: profile, path: out}
  runsc-guests:
    runs-on: ubuntu-latest
    steps:
      - name: busybox and the Phase 0 tarball
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq busybox-static
          mkdir -p out; cp "$(command -v busybox)" out/busybox
          python3 - <<'PY'
          import os, random
          random.seed(1)
          for d in range(2000):
              p = os.path.join("/tmp/tree", "pkg%d" % d, "lib"); os.makedirs(p)
              for f in range(10):
                  with open(os.path.join(p, "f%d.js" % f), "wb") as fh: fh.write(os.urandom(random.randint(512, 8192)))
          PY
          tar -cf out/small.tar -C /tmp/tree .
      - uses: actions/upload-artifact@v4
        with: {name: runsc-guests, path: out}
  runsc-profile:
    needs: runsc-guests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod, cache: false}
      - uses: actions/download-artifact@v4
        with: {name: runsc-guests, path: guests}
      - name: Build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force C:\ci\bin | Out-Null
          go build -p 2 -o C:\ci\bin\runsc.exe ./runsc
          go build -o C:\ci\bin\runsctest.exe ./tools/windows/runsctest
      - name: Rootfs folder
        shell: pwsh
        run: |
          $r = 'C:\ci\work\rootfs'
          foreach ($d in 'bin','etc','proc','dev','tmp') { New-Item -ItemType Directory -Force "$r\$d" | Out-Null }
          foreach ($a in 'busybox','sh','true','tar','mkdir','cat','ls') { Copy-Item guests\busybox "$r\bin\$a" }
          Copy-Item guests\small.tar "$r\small.tar"
      - name: Runs through runsc.exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          foreach ($t in 'noop', 'untar', 'forkexec') {
            foreach ($mode in 'plain', 'stats', 'cpu') {
              Remove-Item Env:GVISOR_PROFSTATS, Env:RUNSC_CPUPROFILE, Env:WINSTUB_TRACE -ErrorAction SilentlyContinue
              if ($mode -eq 'stats') { $env:GVISOR_PROFSTATS = '1' }
              if ($mode -eq 'cpu') { $env:RUNSC_CPUPROFILE = "$PWD\out\runsc-$t.pprof" }
              "===== $t $mode" | Tee-Object -Append out/runsc-runs.txt
              C:\ci\bin\runsctest.exe -runsc C:\ci\bin\runsc.exe -rootfs C:\ci\work\rootfs -work C:\ci\work\w-$t-$mode -only $t 2>&1 | Tee-Object -Append out/runsc-runs.txt | Select-String -Pattern 'RESULT|PROFSTATS|FAIL|PASS' | ForEach-Object { $_.Line }
            }
          }
          foreach ($n in '0', '2') {
            $env:GVISOR_ASPOOL = $n
            "===== forkexec aspool=$n" | Tee-Object -Append out/runsc-runs.txt
            C:\ci\bin\runsctest.exe -runsc C:\ci\bin\runsc.exe -rootfs C:\ci\work\rootfs -work C:\ci\work\w-fe-pool$n -only forkexec 2>&1 | Tee-Object -Append out/runsc-runs.txt | Select-String -Pattern 'RESULT|FAIL' | ForEach-Object { $_.Line }
            Remove-Item Env:GVISOR_ASPOOL
          }
          # A/B in the same job: the root folder revalidated on every walk (the old default).
          foreach ($t in 'untar', 'forkexec') {
            $env:PROF_ROOTFS_OPTIONS = 'cache=shared'
            "===== $t cache=shared" | Tee-Object -Append out/runsc-runs.txt
            C:\ci\bin\runsctest.exe -runsc C:\ci\bin\runsc.exe -rootfs C:\ci\work\rootfs -work C:\ci\work\w-$t-shared -only $t 2>&1 | Tee-Object -Append out/runsc-runs.txt | Select-String -Pattern 'RESULT|FAIL' | ForEach-Object { $_.Line }
            Remove-Item Env:PROF_ROOTFS_OPTIONS
          }
          C:\ci\bin\runsctest.exe -runsc C:\ci\bin\runsc.exe -rootfs C:\ci\work\rootfs -work C:\ci\work\w-mounts -only mounts 2>&1 | Tee-Object -Append out/runsc-runs.txt | Select-Object -First 40
          $env:PROF_RUNSC_FLAGS = '--strace'
          C:\ci\bin\runsctest.exe -runsc C:\ci\bin\runsc.exe -rootfs C:\ci\work\rootfs -work C:\ci\work\w-ut -only untar-trace 2>&1 | Select-Object -Last 3
          Get-ChildItem -Recurse C:\ci\work\w-ut -Filter *.log | ForEach-Object { $_.FullName + ' ' + $_.Length }
          Get-ChildItem -Recurse C:\ci\work\w-ut -Filter *untar-trace*.log | Select-Object -First 1 | Copy-Item -Destination out\untar-trace.log
          Remove-Item Env:PROF_RUNSC_FLAGS
          foreach ($p in 'untar', 'forkexec') {
            "===== pprof $p (flat)" | Tee-Object -Append out/runsc-pprof.txt
            go tool pprof -top -nodecount=50 C:\ci\bin\runsc.exe out/runsc-$p.pprof 2>&1 | Tee-Object -Append out/runsc-pprof.txt | Select-Object -First 62
            "===== pprof $p (cum)" | Tee-Object -Append out/runsc-pprof.txt
            go tool pprof -top -cum -nodecount=50 C:\ci\bin\runsc.exe out/runsc-$p.pprof 2>&1 | Tee-Object -Append out/runsc-pprof.txt | Select-Object -First 62
          }
      - name: Hang check (fork+exec, root folder exclusive and shared)
        timeout-minutes: 40
        shell: pwsh
        continue-on-error: true
        run: |
          New-Item -ItemType Directory -Force out\hang | Out-Null
          foreach ($mode in 'exclusive', 'shared') {
            $pass = 0; $hang = 0
            $n = if ($mode -eq 'exclusive') { 100 } else { 16 }
            for ($i = 0; $i -lt $n; $i++) {
              $env:RUNSC_HANG_DUMP = "$PWD\out\hang\dump-$mode-$i.txt:12"
              Remove-Item Env:PROF_ROOTFS_OPTIONS -ErrorAction SilentlyContinue
              if ($mode -eq 'shared') { $env:PROF_ROOTFS_OPTIONS = 'cache=shared' }
              $o = C:\ci\bin\runsctest.exe -timeout 16s -runsc C:\ci\bin\runsc.exe -rootfs C:\ci\work\rootfs -work C:\ci\work\w-hang-$mode-$i -only forkexec 2>&1 | Out-String
              if ($o -match 'PASS forkexec') { $pass++ } else {
                $hang++
                "FAILED $mode $i" ; ($o -split "`n" | Select-Object -First 40) -join "`n"
                $o | Out-File -Encoding utf8 out\hang\out-$mode-$i.txt
                New-Item -ItemType Directory -Force out\hang | Out-Null
                Copy-Item C:\ci\work\w-hang-$mode-$i\logs\*.log out\hang\$mode-$i.log -ErrorAction SilentlyContinue
              }
              ($o -split "`n" | Select-String 'RESULT') -join ' '
            }
            "HANGCHECK $mode pass=$pass hang=$hang"
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: runsc-profile, path: out}
  # Rewrite mode (ADR 0020): how many %fs executions take the debugger path
  # (docs/results/1s-veneers.md). The same workload runs normally and with every %fs
  # instruction through the debugger (WINSTUB_FSUD2=1), whose count is the total.
  fs-guests:
    runs-on: ubuntu-latest
    steps:
      - name: Debian with python3 and netavark
        run: |
          docker run --name r debian:trixie sh -c 'apt-get update -qq && apt-get install -y -qq --no-install-recommends python3 netavark >/dev/null'
          mkdir -p t
          cat > t/py.py <<'PY'
          import json, re, sys
          n = int(sys.argv[1])
          s = 0
          for i in range(n):
              s += len(json.dumps({"a": [i, str(i)], "b": re.sub("1", "x", str(i))}))
          print("py", n, s)
          PY
          cat > t/nv.sh <<'SH'
          /usr/lib/podman/netavark --version
          for i in 1 2 3; do
            echo '{"name":"n1","driver":"bridge","network_interface":"podman1","subnets":[{"subnet":"10.89.0.0/24","gateway":"10.89.0.1"}],"ipv6_enabled":false,"internal":false,"dns_enabled":false,"ipam_options":{"driver":"host-local"}}' | /usr/lib/podman/netavark create
          done
          echo nv done
          SH
          docker cp t r:/t
          docker export r > fsroot.tar
          ls -l fsroot.tar
      - uses: actions/upload-artifact@v4
        with: {name: fs-guests, path: fsroot.tar, compression-level: 0}
  fs-share:
    needs: fs-guests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {name: fs-guests, path: dl}
      - uses: ./.github/actions/winbin
        with: {targets: sentryguest}
      - name: Debugger share of %fs executions
        shell: pwsh
        run: |
          . tools/windows/ci/leg.ps1
          New-Item -ItemType Directory -Force out | Out-Null
          $work = @(
            @{n='python3'; a=@('/usr/bin/python3', '/t/py.py', '2000')},
            @{n='python3-start'; a=@('/usr/bin/python3', '-c', 'pass')},
            @{n='netavark'; a=@('/bin/sh', '/t/nv.sh')}
          )
          foreach ($leg in 'rewrite', 'rewrite-fxsave') {
            Set-Leg $leg
            foreach ($w in $work) {
              foreach ($ud2 in '', '1') {
                $env:WINSTUB_FSUD2 = $ud2
                $tag = "$leg $($w.n) $(if ($ud2) { 'all-ud2' } else { 'normal' })"
                $t0 = Get-Date
                $o = & C:\ci\bin\sentryguest.exe -profstats -timeout=900s '-tar=dl/fsroot.tar' '-env=PATH=/usr/bin:/bin,HOME=/tmp' @($w.a) 2>&1 | Out-String
                $s = ((Get-Date) - $t0).TotalSeconds
                $o | Out-File -Encoding utf8 "out/$($tag -replace ' ', '_').txt"
                $dbg = 0; foreach ($m in [regex]::Matches($o, 'PROFSTATS key winstub %fs debugger run: (.*?)\s+(\d+)\s+[\d.]+ ms')) { $dbg += [int64]$m.Groups[2].Value }
                "FSSHARE $tag : debugger runs $dbg, $([math]::Round($s, 1)) s, exit: $(($o -split "`n" | Select-String 'sentryguest: exit|py \d|nv done|netavark' | Select-Object -First 3) -join ' / ')" | Tee-Object -Append out/share.txt
                $o -split "`n" | Select-String 'PROFSTATS key winstub' | ForEach-Object { "  $($_.Line.Trim())" } | Tee-Object -Append out/share.txt
              }
            }
          }
          $env:WINSTUB_FSUD2 = ''
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: fs-share, path: out}
