# The runsc zip (runsc.exe, hello/busybox bundle, README, NOTICE, LICENSE) and its clean-machine test: the zip
# extracted into a fresh standard user's profile, hello and a busybox shell command run. Called by ci.yml and
# release.yml; both provide the tmp-win-bin artifact (runsc.exe) and the runsc guests cache (hello, busybox; saved
# by windows-runsc). ci.yml gets the artifact runsc-windows-amd64-<shortsha>; release.yml passes a tmp- name that its
# publish job reads.
name: windows-release
on:
  workflow_call:
    inputs:
      zip-name: {type: string, default: ''}        # default runsc-windows-amd64-<shortsha>.zip
      artifact-name: {type: string, default: ''}   # default runsc-windows-amd64-<shortsha>
      retention-days: {type: number, default: 14}
  workflow_dispatch:
concurrency:
  group: windows-release-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true
jobs:
  bundle:
    runs-on: windows-latest
    outputs:
      artifact: ${{ steps.names.outputs.artifact }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/windows
            test/guests
      - id: names
        shell: bash
        env: {ZIP: "${{ inputs.zip-name }}", ART: "${{ inputs.artifact-name }}"}
        run: |
          short=${GITHUB_SHA::7}
          echo "zip=${ZIP:-runsc-windows-amd64-$short.zip}" >> "$GITHUB_OUTPUT"
          echo "artifact=${ART:-runsc-windows-amd64-$short}" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with: {name: tmp-win-bin, path: 'C:\ci\bin'}
      # the guests windows-runsc built and cached (same key); a miss fails the job
      - uses: actions/cache/restore@v4
        with:
          path: out
          key: runsc-guests-v1-${{ hashFiles('test/guests/**', 'tools/windows/bench/**') }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - shell: pwsh
        run: ./tools/windows/ci/make-release.ps1 -Guests out -Runsc C:\ci\bin\runsc.exe -Out release -Zip "zip\${{ steps.names.outputs.zip }}"
      - uses: actions/upload-artifact@v4
        with: {name: "${{ steps.names.outputs.artifact }}", path: zip, compression-level: 0, retention-days: "${{ inputs.retention-days || 14 }}"}
  test:
    needs: bundle
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {sparse-checkout: "tools/windows"}
      - uses: actions/download-artifact@v4
        with: {name: "${{ needs.bundle.outputs.artifact }}", path: 'C:\rt\zip'}
      - name: Extract and run as a standard user
        shell: pwsh
        run: |
          $zip = (Get-ChildItem C:\rt\zip -Filter '*.zip').FullName
          & tools/windows/ci/run-as-standard-user.ps1 `
            -Program 'C:\Program Files\PowerShell\7\pwsh.exe' `
            -Arguments '-NoProfile','-File',"$PWD\tools\windows\ci\release-test.ps1",'-Zip',$zip `
            -GrantPath C:\rt,$PWD -TimeoutSeconds 600
