# Called by ci.yml on push; dispatch it alone with `gh workflow run windows-sentry --ref <branch>`.
name: windows-sentry

on:
  workflow_call:
    inputs:
      prebuilt: {type: boolean, default: false}
  workflow_dispatch:

concurrency:
  group: windows-sentry-${{ github.ref }}-${{ inputs.prebuilt && 'ci' || 'solo' }}
  cancel-in-progress: true

env:
  CGO_ENABLED: "0"

jobs:
  sentry-host:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/winbin
        with: {prebuilt: "${{ inputs.prebuilt }}", targets: "sentrysmoke,safecopy,pgalloc"}
      # The init loop below needs the toolchain; when prebuilt winbin has not set it up.
      - if: inputs.prebuilt
        uses: ./.github/actions/gosetup
      - name: Sentry smoke program
        shell: bash
        run: timeout 300 C:/ci/bin/sentrysmoke.exe
      - name: Diagnostics of memclr faults
        if: always()
        shell: bash
        run: (cd pkg/safecopy && C:/ci/bin/safecopy.test.exe -test.count=1 -test.v -test.run TestWindowsFaultMatrix -test.timeout 60s) 2>&1 | grep -E "DIAG|hasERMS|panic|FAIL|ok|PASS" | head -400
      - name: Tests of pkg/safecopy
        if: always()
        shell: bash
        run: |
          set +e
          (cd pkg/safecopy && C:/ci/bin/safecopy.test.exe -test.count=1 -test.v -test.timeout=100s) > safecopy.log 2>&1
          rc=$?
          grep -E "^([[:space:]]*--- FAIL|FAIL|ok|PASS|panic|fatal)" safecopy.log | head -60
          echo "top-level: $(grep -cE "^--- PASS" safecopy.log) passed, $(grep -cE "^--- FAIL" safecopy.log) failed, $(grep -cE "^--- SKIP" safecopy.log) skipped; subtests: $(grep -cE "^[[:space:]]+--- PASS" safecopy.log) passed, $(grep -cE "^[[:space:]]+--- FAIL" safecopy.log) failed, $(grep -cE "^[[:space:]]+--- SKIP" safecopy.log) skipped"
          exit $rc
      - name: Tests of pkg/sentry/pgalloc
        if: always()
        shell: bash
        run: |
          set +e
          (cd pkg/sentry/pgalloc && C:/ci/bin/pgalloc.test.exe -test.count=1 -test.v -test.timeout=200s) > pgalloc.log 2>&1
          rc=$?
          grep -E "^([[:space:]]*--- (FAIL|SKIP|PASS)|FAIL|ok|PASS|panic|fatal)" pgalloc.log | head -60
          echo "top-level: $(grep -cE "^--- PASS" pgalloc.log) passed, $(grep -cE "^--- FAIL" pgalloc.log) failed, $(grep -cE "^--- SKIP" pgalloc.log) skipped"
          exit $rc
      - name: Init of each package alone
        if: always()
        shell: bash
        run: |
          # One failing init must not hide the others, so each runs in its own program.
          fail=0
          for p in pkg/hosttid pkg/cpuid pkg/hostarch pkg/rand pkg/safecopy pkg/sentry/time pkg/sentry/pgalloc pkg/sentry/kernel pkg/sentry/vfs pkg/sentry/loader runsc/boot; do
            d=$(mktemp -d -p .)
            printf 'package main\nimport _ "gvisor.dev/gvisor/%s"\nfunc main() { println("init ok") }\n' "$p" > "$d/main.go"
            if timeout 300 go run "$d" > "$d/out.txt" 2>&1; then echo "PASS init $p"; else echo "FAIL init $p"; head -12 "$d/out.txt"; fail=1; fi
            rm -rf "$d"
          done
          exit $fail
