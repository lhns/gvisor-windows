# Weekly: merge google/gvisor `go` into a new branch from `windows`, build it, push the branch.
# On a conflict or a build failure it opens (or updates) the issue "Upstream merge needs attention".
# Never pushes to `windows` and never writes to google/gvisor. Schedule and dispatch only: a push
# trigger is not allowed here (build.yml checks it).
name: upstream-merge
on:
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:
concurrency:
  group: upstream-merge
  cancel-in-progress: false
permissions:
  contents: write
  issues: write
jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: windows
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Merge upstream, build, push the branch, report
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/upstream-merge.sh
