# Diagnosis of the rewrite-mode heap corruption (docs/results/1p-rewrite-heap.md): probe guests built on
# Debian bookworm (static glibc without AVX at start, also for the development VM), their disassembly,
# and the probe cases run through runsc.exe in native and rewrite mode.
name: windows-glibc-diag
on:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  guests:
    runs-on: ubuntu-latest
    container: debian:bookworm
    steps:
      - run: apt-get update -qq && apt-get install -y -qq gcc libc6-dev binutils git >/dev/null
      - uses: actions/checkout@v4
        with: {sparse-checkout: test/guests}
      - run: |
          mkdir -p out dis
          for g in aptrename fsstress mountkeep devnull ovlsub; do gcc -static -no-pie -O1 -Wall -o out/$g test/guests/$g.c; done
          gcc -static -no-pie -O1 -Wall -o out/aptprobe test/guests/phc/aptprobe.c
          gcc -static -no-pie -O1 -Wall -o out/heapprobe test/guests/phc/heapprobe.c
          for g in aptrename aptprobe heapprobe; do objdump -d out/$g > dis/$g.txt; nm -n out/$g > dis/$g.nm; done
      - uses: actions/upload-artifact@v4
        with: {name: phc-guests, path: out}
      - uses: actions/upload-artifact@v4
        with: {name: phc-dis, path: dis}
  run:
    needs: guests
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [native, rewrite]
    env:
      WINSTUB_FSMODE: ${{ matrix.mode }}
      WINSTUB_KEEP_AVX512: ${{ matrix.mode != 'native' && '1' || '' }}
      WINSTUB_FSLOG: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod, cache: false}
      - uses: actions/download-artifact@v4
        with: {name: phc-guests, path: guests}
      - name: Build
        shell: pwsh
        run: go build -p 2 -o C:\ci\bin\runsc.exe ./runsc
      - name: Probes
        shell: pwsh
        run: |
          $cases = Get-Content test/guests/phc/cases.txt | Where-Object { $_ -and -not $_.StartsWith('#') }
          & test/guests/phc/run.ps1 -Runsc C:\ci\bin\runsc.exe -Guests guests -Work C:\ci\work -Cases $cases -Reps 2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phc-logs-${{ matrix.mode }}
          path: |
            C:\ci\work\*.log
            C:\ci\work\*.out
            C:\ci\work\*.err
