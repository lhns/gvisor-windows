# Phase 1c: the winstub platform (pkg/sentry/platform/winstub) on a hosted Windows
# runner (FSGSBASE): syscalls, faults, interrupts, a second address space.
name: windows-platform
on:
  push:
    branches: [winstub-platform, static-guest, platform-perf]
    paths: ["pkg/sentry/platform/**", ".github/workflows/windows-platform.yml"]
  workflow_dispatch:
jobs:
  platform:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod, cache: false}
      - name: Build
        shell: pwsh
        run: |
          Get-CimInstance Win32_Processor | Select-Object Name, NumberOfLogicalProcessors | Format-List
          go vet ./pkg/sentry/platform/winstub ./pkg/sentry/platform/winstub/stubasm ./pkg/sentry/platform/winstub/pe
          go test -c -o winstub.test.exe ./pkg/sentry/platform/winstub
      - name: Tests
        shell: pwsh
        working-directory: pkg/sentry/platform/winstub
        env: {WINSTUB_DEBUG: "1"}
        run: |
          $fail = 0
          foreach ($t in 'TestSyscallsFaultsInterrupt','TestExecuteFault','TestUnmapAndRemap','TestNewThreadsAndSpeed','TestForkedAddressSpace','TestWriteExecute','TestFPState','TestSyscallLatency','TestStubStart','TestStubStartExperiment','TestDecodeAllMatchesSerial') {
            "===== $t" | Tee-Object -Append -FilePath ../../../../tests.txt
            $a = @(("-test.run=^" + $t + [char]36), "-test.v=true", "-test.timeout=3m"); & ../../../../winstub.test.exe @a 2>&1 | Tee-Object -Append -FilePath ../../../../tests.txt
            "exit: $LASTEXITCODE" | Tee-Object -Append -FilePath ../../../../tests.txt
            if ($LASTEXITCODE -ne 0) { $fail = 1 }
          }
          exit $fail
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: winstub-output, path: tests.txt}
