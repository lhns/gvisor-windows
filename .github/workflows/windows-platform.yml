# Phase 1c: the winstub platform (pkg/sentry/platform/winstub) on a hosted Windows
# runner (FSGSBASE): syscalls, faults, interrupts, a second address space. Three
# legs (ADR 0020): native %fs, forced rewrite mode, rewrite mode without XSAVE.
name: windows-platform
on:
  push:
    paths: ["pkg/**", "runsc/**", "third_party/**", "tools/windows/**", "test/guests/**", "go.mod", ".github/workflows/windows-platform.yml"]
  workflow_dispatch:
jobs:
  platform:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [native, rewrite, rewrite-fxsave]
    env:
      WINSTUB_FSMODE: ${{ matrix.mode == 'native' && 'native' || 'rewrite' }}
      WINSTUB_FPMODE: ${{ matrix.mode == 'rewrite-fxsave' && 'fxsave' || '' }}
      WINSTUB_TRIPWIRE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod, cache: false}
      - name: Build
        shell: pwsh
        run: |
          Get-CimInstance Win32_Processor | Select-Object Name, NumberOfLogicalProcessors | Format-List
          go vet ./pkg/sentry/platform/winstub ./pkg/sentry/platform/winstub/stubasm ./pkg/sentry/platform/winstub/pe
          go test -c -o winstub.test.exe ./pkg/sentry/platform/winstub
      - name: Tests
        shell: pwsh
        working-directory: pkg/sentry/platform/winstub
        env: {WINSTUB_DEBUG: "1"}
        run: |
          $fail = 0
          foreach ($t in 'TestSyscallsFaultsInterrupt','TestExecuteFault','TestUnmapAndRemap','TestNewThreadsAndSpeed','TestForkedAddressSpace','TestWriteExecute','TestFPState','TestSyscallLatency','TestStubStart','TestStubStartExperiment','TestDecodeAllMatchesSerial','TestSplitSyscall','TestInterruptStorm','TestMapNonSectionFile','TestMemoryRelease','TestSplitSyscallAfterUnmap','TestSplitSyscallWX','TestOversubscribed','TestShareReadOnlySection','TestManyThreads','TestVeneerSurvivesNewAddressSpace','TestFSVeneerEncoding','TestScanFS','TestFSVeneerVEX','TestFSInstructions','TestFSInterrupt','TestFSSpeed','TestAVX512State','TestFSInstructionAfterSplit','TestTripwire','TestSeamRedecode','TestEntryAfterPadding','TestFSDifferential') {
            "===== $t" | Tee-Object -Append -FilePath ../../../../tests.txt
            $a = @(("-test.run=^" + $t + [char]36), "-test.v=true", "-test.timeout=3m"); & ../../../../winstub.test.exe @a 2>&1 | Tee-Object -Append -FilePath ../../../../tests.txt
            "exit: $LASTEXITCODE" | Tee-Object -Append -FilePath ../../../../tests.txt
            if ($LASTEXITCODE -ne 0) { $fail = 1 }
          }
          exit $fail
      - name: Cost of a veneer, both modes on this machine
        if: always() && matrix.mode == 'native'
        continue-on-error: true
        shell: pwsh
        working-directory: pkg/sentry/platform/winstub
        run: |
          foreach ($round in 1..3) {
            foreach ($m in 'native', 'rewrite') {
              $env:WINSTUB_FSMODE = $m
              & ../../../../winstub.test.exe "-test.run=^TestFSSpeed$" "-test.v=true" 2>&1 | Select-String "FSSPEED" | Tee-Object -Append -FilePath ../../../../tuning.txt
            }
          }
      - name: Spin policy matrix
        if: always() && matrix.mode == 'native'
        continue-on-error: true
        shell: pwsh
        working-directory: pkg/sentry/platform/winstub
        env: {WINSTUB_MATRIX: "1"}
        run: |
          $a = @("-test.run=^TestPolicyMatrix$", "-test.v=true", "-test.timeout=10m")
          & ../../../../winstub.test.exe @a 2>&1 | Select-String "MATRIX" | Tee-Object -Append -FilePath ../../../../tuning.txt
      - name: Oversubscription, with and without the spin limit
        if: always() && matrix.mode == 'native'
        continue-on-error: true
        shell: pwsh
        working-directory: pkg/sentry/platform/winstub
        run: |
          foreach ($l in 4, 1000) {
            $env:WINSTUB_SPINLIMIT = "$l"
            "===== spin limit $l" | Tee-Object -Append -FilePath ../../../../tuning.txt
            $a = @("-test.run=^TestOversubscribed$|^TestSyscallLatency$", "-test.v=true")
            & ../../../../winstub.test.exe @a 2>&1 | Select-String "OVERSUB|LATENCY" | Tee-Object -Append -FilePath ../../../../tuning.txt
          }
      - name: Spin tuning
        if: always() && matrix.mode == 'native'
        continue-on-error: true
        shell: pwsh
        working-directory: pkg/sentry/platform/winstub
        run: |
          foreach ($s in 300, 1000, 3000) {
            foreach ($c in 2000, 20000) {
              $env:WINSTUB_STUBSPIN = "$s"; $env:WINSTUB_CTLSPIN = "$c"
              "===== stub spin $s, sentry spin $c" | Tee-Object -Append -FilePath ../../../../tuning.txt
              $a = @("-test.run=^TestSyscallLatency$", "-test.v=true")
              & ../../../../winstub.test.exe @a 2>&1 | Select-String "LATENCY" | Tee-Object -Append -FilePath ../../../../tuning.txt
            }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: "winstub-output-${{ matrix.mode }}", path: "tests.txt\ntuning.txt"}
