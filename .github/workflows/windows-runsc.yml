# Boot runsc on Windows: "runsc.exe run" with an OCI bundle whose rootfs is a
# Windows folder, stdio, network and a terminal, all as a standard user. Called by
# ci.yml on push; dispatch it alone with
# `gh workflow run windows-runsc --ref <branch> -f only=<runsctest cases> -f legs=native`.
name: windows-runsc
on:
  workflow_call:
    inputs:
      prebuilt: {type: boolean, default: false}
      only: {type: string, default: ''}
      legs: {type: string, default: ''}
      group: {type: string, default: ''}   # concurrency group suffix of a caller other than ci.yml
  workflow_dispatch:
    inputs:
      only: {description: 'runsctest cases to run, e.g. erofs,hostfs (default: the whole suite)', default: ''}
      legs: {description: 'comma list of legs: native, rewrite, rewrite-fxsave (default all)', default: ''}
concurrency:
  group: windows-runsc-${{ github.ref }}-${{ inputs.group || (inputs.prebuilt && 'ci' || 'solo') }}
  cancel-in-progress: true
jobs:
  guests:
    runs-on: ubuntu-latest
    outputs:
      legs: ${{ steps.legs.outputs.legs }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            test/guests
            tools/windows/bench
      - id: legs
        run: echo "legs=$(echo '${{ inputs.legs || 'native,rewrite,rewrite-fxsave' }}' | sed 's/ //g; s/,/","/g; s/^/["/; s/$/"]/')" >> "$GITHUB_OUTPUT"
      # The guests depend only on these inputs (bump v2 to rebuild: the base images float).
      # the key is the git object ids of the inputs, not hashFiles: CRLF checkouts on Windows hash differently
      - id: key
        shell: bash
        run: echo "key=runsc-guests-v2-$(git rev-parse HEAD:test/guests HEAD:tools/windows/bench | tr -d '\n')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: cache
        with:
          path: out
          key: ${{ steps.key.outputs.key }}
          enableCrossOsArchive: true   # the Windows jobs restore it
      - name: Build guests
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq busybox-static erofs-utils
          mkdir -p out
          docker run --rm -v "$PWD:/w" -w /w debian:bookworm sh -c 'apt-get update -qq && apt-get install -y -qq gcc libc6-dev >/dev/null && sh test/guests/build-glibc.sh out'
          docker run --rm -v "$PWD:/w" -w /w debian:bookworm sh -c 'apt-get update -qq && apt-get install -y -qq busybox-static >/dev/null && cp /bin/busybox out/busybox'
          c=$(docker create debian:12-slim); mkdir -p out/dbin
          for f in /lib/x86_64-linux-gnu/libc.so.6 /lib64/ld-linux-x86-64.so.2 /bin/echo; do docker cp -L $c:$f out/dbin/; done
          ls -l out/dbin
          file out/*
          ! ldd out/busybox
          # The same rootfs as an erofs image, applets as symlinks.
          r=$(mktemp -d); mkdir -p $r/bin $r/etc $r/proc $r/dev $r/tmp
          cp out/hello $r/bin/hello; cp out/busybox $r/bin/busybox
          for a in sh cat; do ln -s busybox $r/bin/$a; done
          echo ciguest > $r/etc/hostname
          chmod 755 $r; mkfs.erofs --all-root out/rootfs.erofs $r
          # The Phase 0 workloads: 20k small files, and the same script on the Linux runner as the native baseline.
          python3 - <<'PY'
          import os, random
          random.seed(1)
          for d in range(2000):
              p = os.path.join("/tmp/tree", "pkg%d" % d, "lib"); os.makedirs(p)
              for f in range(10):
                  with open(os.path.join(p, "f%d.js" % f), "wb") as fh: fh.write(os.urandom(random.randint(512, 8192)))
          PY
          tar -cf out/small.tar -C /tmp/tree .
          cp tools/windows/bench/bench.sh out/bench.sh
          W=$PWD; mkdir -p /tmp/bb /tmp/nb && out/busybox --install -s /tmp/bb
          (cd /tmp/nb && PATH=/tmp/bb:$PATH $W/out/busybox sh $W/out/bench.sh $W/out/small.tar /tmp/nb/bind /tmp/nb/root /tmp/nb/shm) | tee out/native.txt || true
  run:
    needs: guests
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        mode: ${{ fromJSON(needs.guests.outputs.legs) }}
    env:
      WINSTUB_FSMODE: ${{ matrix.mode == 'native' && 'native' || 'rewrite' }}
      WINSTUB_FPMODE: ${{ matrix.mode == 'rewrite-fxsave' && 'fxsave' || '' }}
      WINSTUB_KEEP_AVX512: ${{ matrix.mode == 'rewrite' && '1' || '' }}
    steps:
      - uses: actions/checkout@v4
      # the key is the git object ids of the inputs, not hashFiles: CRLF checkouts on Windows hash differently
      - id: key
        shell: bash
        run: echo "key=runsc-guests-v2-$(git rev-parse HEAD:test/guests HEAD:tools/windows/bench | tr -d '\n')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        with:
          path: out
          key: ${{ steps.key.outputs.key }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - run: Move-Item out guests
        shell: pwsh
      - uses: ./.github/actions/winbin
        with: {prebuilt: "${{ inputs.prebuilt }}", targets: "runsc,runsctest"}
      - name: Rootfs folder
        shell: pwsh
        run: |
          # busybox applets are copies: the Windows folder has no Linux symlinks.
          $r = 'C:\ci\work\rootfs'
          foreach ($d in 'bin','etc','proc','dev','tmp','www') { New-Item -ItemType Directory -Force "$r\$d" | Out-Null }
          Copy-Item guests\hello "$r\bin\hello"; Copy-Item guests\unixsock "$r\bin\unixsock"; Copy-Item guests\cfr "$r\bin\cfr"; Copy-Item guests\clocks "$r\bin\clocks"; New-Item -ItemType Directory -Force "$r\dbin" | Out-Null; Copy-Item guests\dbin\* "$r\dbin"
          foreach ($a in 'busybox','sh','ls','cat','wget','httpd','sleep','stty','tty','true','chmod','ln','chown','touch','tar','head','sha256sum','gzip','awk','cut','mkdir','rm') { Copy-Item guests\busybox "$r\bin\$a" }
          Copy-Item guests\rootfs.erofs C:\ci\work\rootfs.erofs
          Copy-Item guests\bench.sh "$r\bench.sh"; Copy-Item guests\small.tar "$r\small.tar"
          [IO.File]::WriteAllText("$r\etc\hostname", "ciguest`n")
          [IO.File]::WriteAllText("$r\www\index.html", "hello-from-guest`n")
          Get-ChildItem -Recurse $r | Select-Object FullName, Length | Format-Table -AutoSize | Out-String -Width 200
      - id: hello-admin
        name: Hello as the runner's administrator (diagnostic)
        if: inputs.only == ''
        shell: pwsh
        continue-on-error: true
        run: |
          C:\ci\bin\runsctest.exe -runsc C:\ci\bin\runsc.exe -rootfs C:\ci\work\rootfs -work C:\ci\work\admin -only hello
      - id: tty-admin
        name: Terminal as the runner's administrator (diagnostic)
        if: inputs.only == ''
        shell: pwsh
        continue-on-error: true
        run: |
          C:\ci\bin\runsctest.exe -runsc C:\ci\bin\runsc.exe -rootfs C:\ci\work\rootfs -work C:\ci\work\admin -only tty
      - id: erofs
        name: Erofs image root as a standard user
        if: inputs.only == ''
        shell: pwsh
        run: |
          $wargs = @('-fsmode', $env:WINSTUB_FSMODE); if ($env:WINSTUB_FPMODE) { $wargs += '-fpmode', $env:WINSTUB_FPMODE }
          & tools/windows/ci/run-as-standard-user.ps1 `
            -Program C:\ci\bin\runsctest.exe `
            -Arguments ($wargs + @('-runsc','C:\ci\bin\runsc.exe','-rootfs','C:\ci\work\rootfs','-work','C:\ci\work\std-erofs','-image','C:\ci\work\rootfs.erofs','-only','erofs')) `
            -GrantPath C:\ci\bin -WritablePath C:\ci\work -TimeoutSeconds 300
      - id: hostfs
        name: Host-folder rename and the port forwarder API as a standard user
        if: inputs.only == ''
        shell: pwsh
        run: |
          $wargs = @('-fsmode', $env:WINSTUB_FSMODE); if ($env:WINSTUB_FPMODE) { $wargs += '-fpmode', $env:WINSTUB_FPMODE }
          & tools/windows/ci/run-as-standard-user.ps1 `
            -Program C:\ci\bin\runsctest.exe `
            -Arguments ($wargs + @('-runsc','C:\ci\bin\runsc.exe','-rootfs','C:\ci\work\rootfs','-work','C:\ci\work\std-hostfs','-only','hostfs,forward,sockfs,fchmod,strace,cfr,restart')) `
            -GrantPath C:\ci\bin -WritablePath C:\ci\work -TimeoutSeconds 300
      - id: debian
        name: debian loader from the root folder
        if: inputs.only == ''
        shell: pwsh
        run: |
          $wargs = @('-fsmode', $env:WINSTUB_FSMODE); if ($env:WINSTUB_FPMODE) { $wargs += '-fpmode', $env:WINSTUB_FPMODE }
          & tools/windows/ci/run-as-standard-user.ps1 `
            -Program C:\ci\bin\runsctest.exe `
            -Arguments ($wargs + @('-runsc','C:\ci\bin\runsc.exe','-rootfs','C:\ci\work\rootfs','-work','C:\ci\work\std-debian','-only','debian')) `
            -GrantPath C:\ci\bin -WritablePath C:\ci\work -TimeoutSeconds 300
      - id: case
        name: Case sensitivity as a standard user (known gap, Windows denies the flag, see docs/results/5-podman-windows.md)
        if: inputs.only == ''
        shell: pwsh
        continue-on-error: true
        run: |
          $wargs = @('-fsmode', $env:WINSTUB_FSMODE); if ($env:WINSTUB_FPMODE) { $wargs += '-fpmode', $env:WINSTUB_FPMODE }
          & tools/windows/ci/run-as-standard-user.ps1 `
            -Program C:\ci\bin\runsctest.exe `
            -Arguments ($wargs + @('-runsc','C:\ci\bin\runsc.exe','-rootfs','C:\ci\work\rootfs','-work','C:\ci\work\std-case','-only','case')) `
            -GrantPath C:\ci\bin -WritablePath C:\ci\work -TimeoutSeconds 300
      - id: bench
        name: Phase 0 workloads and start-to-exit as a standard user
        if: inputs.only == ''
        shell: pwsh
        continue-on-error: true
        run: |
          Get-Content guests\native.txt
          $wargs = @('-fsmode', $env:WINSTUB_FSMODE); if ($env:WINSTUB_FPMODE) { $wargs += '-fpmode', $env:WINSTUB_FPMODE }
          & tools/windows/ci/run-as-standard-user.ps1 `
            -Program C:\ci\bin\runsctest.exe `
            -Arguments ($wargs + @('-runsc','C:\ci\bin\runsc.exe','-rootfs','C:\ci\work\rootfs','-work','C:\ci\work\std-bench','-only','bench')) `
            -GrantPath C:\ci\bin -WritablePath C:\ci\work -TimeoutSeconds 1200
      - id: lifecycle
        name: Container lifecycle commands as a standard user
        if: inputs.only == ''
        shell: pwsh
        run: |
          $wargs = @('-fsmode', $env:WINSTUB_FSMODE); if ($env:WINSTUB_FPMODE) { $wargs += '-fpmode', $env:WINSTUB_FPMODE }
          & tools/windows/ci/run-as-standard-user.ps1 `
            -Program C:\ci\bin\runsctest.exe `
            -Arguments ($wargs + @('-runsc','C:\ci\bin\runsc.exe','-rootfs','C:\ci\work\rootfs','-work','C:\ci\work\std-lifecycle','-only','lifecycle')) `
            -GrantPath C:\ci\bin -WritablePath C:\ci\work -TimeoutSeconds 600
      - id: all
        name: All tests as a standard user
        if: inputs.only == ''
        shell: pwsh
        run: |
          $wargs = @('-fsmode', $env:WINSTUB_FSMODE); if ($env:WINSTUB_FPMODE) { $wargs += '-fpmode', $env:WINSTUB_FPMODE }
          & tools/windows/ci/run-as-standard-user.ps1 `
            -Program C:\ci\bin\runsctest.exe `
            -Arguments ($wargs + @('-runsc','C:\ci\bin\runsc.exe','-rootfs','C:\ci\work\rootfs','-work','C:\ci\work\std')) `
            -GrantPath C:\ci\bin -WritablePath C:\ci\work -TimeoutSeconds 1500
      - id: selected
        name: Selected cases as a standard user
        if: inputs.only != ''
        shell: pwsh
        run: |
          $wargs = @('-fsmode', $env:WINSTUB_FSMODE); if ($env:WINSTUB_FPMODE) { $wargs += '-fpmode', $env:WINSTUB_FPMODE }
          & tools/windows/ci/run-as-standard-user.ps1 `
            -Program C:\ci\bin\runsctest.exe `
            -Arguments ($wargs + @('-runsc','C:\ci\bin\runsc.exe','-rootfs','C:\ci\work\rootfs','-work','C:\ci\work\std','-only','${{ inputs.only }}')) `
            -GrantPath C:\ci\bin -WritablePath C:\ci\work -TimeoutSeconds 1500
      - name: Summary
        if: always()
        shell: pwsh
        env: {STEPS: "${{ toJSON(steps) }}"}
        run: ./tools/windows/ci/summary.ps1 -Title 'runsc ${{ matrix.mode }}' -Steps $env:STEPS
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: logs-windows-runsc-${{ matrix.mode }}
          path: |
            C:\ci\work\admin\logs
            C:\ci\work\std\logs
            C:\ci\work\std-erofs\logs
            C:\ci\work\std-hostfs\logs
            C:\ci\work\std-case\logs
            C:\ci\work\std-lifecycle\logs
            C:\ci\work\std-lifecycle\lifecycle-root
            C:\ci\work\std-bench\logs
