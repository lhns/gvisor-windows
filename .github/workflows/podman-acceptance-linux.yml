name: podman-acceptance-linux
on:
  push:
    branches: [windows]
    paths: ["test/e2e/podman-acceptance/**", ".github/workflows/podman-acceptance-linux.yml"]
  workflow_dispatch:

env:
  RESULTS_DIR: ${{ github.workspace }}/results

jobs:
  # Stage A: podman + crun inside a runsc (systrap) sandbox, acceptance test from the host.
  # Stage B: the same test against native podman (sanity check of the test).
  acceptance:
    name: acceptance-${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: native,             engine: native}
          - {name: runsc-bridge-tmpfs,        engine: runsc, storage: tmpfs,   driver: "",  hostnet: "0"}
          - {name: runsc-hostnet-tmpfs,       engine: runsc, storage: tmpfs,   driver: "",  hostnet: "1"}
          - {name: runsc-hostnet-hostdir-overlay, engine: runsc, storage: hostdir, driver: "", hostnet: "1"}
          - {name: runsc-hostnet-hostdir-vfs, engine: runsc, storage: hostdir, driver: vfs, hostnet: "1"}
    steps:
      - uses: actions/checkout@v4
        with: {sparse-checkout: "test/e2e"}
      - run: mkdir -p "$RESULTS_DIR/out" && test/e2e/podman-acceptance/harness/install.sh
      - name: Start engine
        run: |
          export SHARE_DIR=/tmp/acc-share
          if [ "${{ matrix.engine }}" = native ]; then
            test/e2e/podman-acceptance/harness/engine-native.sh start
          else
            STORAGE=${{ matrix.storage }} STORAGE_DRIVER=${{ matrix.driver }} test/e2e/podman-acceptance/harness/engine-runsc.sh start
          fi
      - name: Probe sandbox (before test)
        if: matrix.engine == 'runsc'
        run: |
          docker exec -i podman-in-runsc sh -s <test/e2e/podman-acceptance/harness/probe.sh >"$RESULTS_DIR/out/probe-before.txt" 2>&1 || true
          cat "$RESULTS_DIR/out/probe-before.txt"
      - name: Acceptance test
        run: |
          export SHARE_DIR=/tmp/acc-share RESULTS_DIR="$RESULTS_DIR/out"
          if [ "${{ matrix.engine }}" = native ]; then
            export CONTAINER_HOST=unix:///tmp/podman-native.sock ENGINE_CTL="$PWD/test/e2e/podman-acceptance/harness/engine-native.sh"
          else
            export CONTAINER_HOST=unix:///tmp/podman-runsc.sock
            export STORAGE=${{ matrix.storage }} STORAGE_DRIVER=${{ matrix.driver }}
            export ENGINE_CTL="$PWD/test/e2e/podman-acceptance/harness/engine-runsc.sh"
          fi
          if [ "${{ matrix.hostnet }}" = 1 ]; then export HOSTNET=1 NETARGS=--network=host; fi
          test/e2e/podman-acceptance/run.sh || true
      - name: Probe sandbox
        if: always() && matrix.engine == 'runsc'
        run: |
          docker exec -i podman-in-runsc sh -s <test/e2e/podman-acceptance/harness/probe.sh >"$RESULTS_DIR/out/probe.txt" 2>&1 || true
          cp /tmp/socat.log "$RESULTS_DIR/out/" || true
      - name: Diagnostics
        if: always()
        run: |
          cd "$RESULTS_DIR/out"
          docker logs podman-in-runsc >engine-container.log 2>&1 || true
          cp /tmp/podman-native.log . 2>/dev/null || true
          ls /tmp/runsc-logs 2>/dev/null | head -3
          sudo tar -czf runsc-logs.tgz --warning=no-file-changed -C /tmp runsc-logs 2>/dev/null || true
          { echo "### acceptance-${{ matrix.name }}"; echo '```'; cat steps.txt; echo '```'; } >>"$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acceptance-${{ matrix.name }}
          path: results/out
          retention-days: 30

  # Strict bar (ADR 0002): -p 8080:80 from outside the sandbox, compose by service name.
  # Matrix: Podman engine version x cgroups x network mode, all with the store on a host dir.
  strict:
    name: strict-${{ matrix.podman }}-${{ matrix.cg }}-${{ matrix.net }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        podman: ["v5.7.1", "v6.2.0"]
        cg: [disabled, enabled]
        net: [bridge, pasta, slirp4netns, host]
    steps:
      - uses: actions/checkout@v4
        with: {sparse-checkout: "test/e2e"}
      - run: mkdir -p "$RESULTS_DIR/out" && test/e2e/podman-acceptance/harness/install.sh
        env: {PODMAN_IMAGE: "quay.io/podman/stable:${{ matrix.podman }}"}
      - name: Start engine
        run: |
          export SHARE_DIR=/tmp/acc-share STORAGE=hostdir PODMAN_IMAGE=quay.io/podman/stable:${{ matrix.podman }} CGROUPS=${{ matrix.cg }}
          test/e2e/podman-acceptance/harness/engine-runsc.sh start
          docker exec podman-in-runsc podman version | tee "$RESULTS_DIR/out/engine-version.txt"
      - name: Acceptance test
        run: |
          export SHARE_DIR=/tmp/acc-share RESULTS_DIR="$RESULTS_DIR/out" STORAGE=hostdir
          export PODMAN_IMAGE=quay.io/podman/stable:${{ matrix.podman }} CGROUPS=${{ matrix.cg }}
          export CONTAINER_HOST=unix:///tmp/podman-runsc.sock
          export ENGINE_CTL="$PWD/test/e2e/podman-acceptance/harness/engine-runsc.sh"
          case "${{ matrix.net }}" in
            host) export HOSTNET=1 NETARGS=--network=host ;;
            bridge) ;;
            *) export NETARGS=--network=${{ matrix.net }} ;;
          esac
          test/e2e/podman-acceptance/run.sh || true
      - name: Diagnostics
        if: always()
        run: |
          cd "$RESULTS_DIR/out"
          docker logs podman-in-runsc >engine-container.log 2>&1 || true
          { echo "### strict-${{ matrix.podman }}-${{ matrix.cg }}-${{ matrix.net }}"; echo '```'; cat engine-version.txt | grep -E '^Version' ; cat steps.txt; echo '```'; } >>"$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: strict-${{ matrix.podman }}-${{ matrix.cg }}-${{ matrix.net }}
          path: results/out
          retention-days: 30

  # Which netlink operations does netavark need? Run podman directly inside a --strace sandbox.
  netlink-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {sparse-checkout: "test/e2e"}
      - run: mkdir -p "$RESULTS_DIR" && test/e2e/podman-acceptance/harness/install.sh
      - name: Probe
        run: |
          mkdir -p "$RESULTS_DIR/probe"
          for net in bridge pasta slirp4netns; do
            docker rm -f nlp >/dev/null 2>&1
            docker run --name nlp --runtime runsc-strace --cap-add all --security-opt seccomp=unconfined --user root --entrypoint ''               --tmpfs /var/lib/containers:rw,exec,mode=755 -e CONTAINERS_STORAGE_CONF=/etc/containers/storage.conf               -v "$PWD/test/e2e/podman-acceptance/harness/containers.conf:/etc/containers/containers.conf:ro"               -v "$PWD/test/e2e/podman-acceptance/harness/storage.conf:/etc/containers/storage.conf:ro"               quay.io/podman/stable:latest sh -c "podman version | head -3; podman run --rm --network=$net mirror.gcr.io/library/alpine:3.20 sh -c 'ip addr; ip route; echo NET_OK'"               >"$RESULTS_DIR/probe/run-$net.txt" 2>&1 || true
            cat "$RESULTS_DIR/probe/run-$net.txt"
            docker rm -f nlp >/dev/null 2>&1
          done
          # Same podman commands under runc (control), and raw netlink operations under runsc.
          for net in bridge pasta; do
            docker rm -f nlc >/dev/null 2>&1
            docker run --name nlc --privileged --user root --entrypoint '' --tmpfs /var/lib/containers:rw,exec,mode=755               -e CONTAINERS_STORAGE_CONF=/etc/containers/storage.conf               -v "$PWD/test/e2e/podman-acceptance/harness/containers.conf:/etc/containers/containers.conf:ro"               -v "$PWD/test/e2e/podman-acceptance/harness/storage.conf:/etc/containers/storage.conf:ro"               quay.io/podman/stable:latest sh -c "podman run --rm --network=$net mirror.gcr.io/library/alpine:3.20 sh -c 'echo NET_OK'"               >"$RESULTS_DIR/probe/control-runc-$net.txt" 2>&1 || true
            cat "$RESULTS_DIR/probe/control-runc-$net.txt"
          done
          sudo chmod -R a+r /tmp/runsc-logs
          ( cd /tmp/runsc-logs; grep -rhE 'netavark [EX] (socket|setsockopt|bind|sendto|sendmsg|recvmsg)' . | cut -c1-300 | head -60 >"$RESULTS_DIR/probe/stage1-netavark.txt" )
          sudo rm -rf /tmp/runsc-logs/*
          docker rm -f nlp >/dev/null 2>&1
          docker run --name nlp --runtime runsc-strace --cap-add all --security-opt seccomp=unconfined --user root --entrypoint ''             -i quay.io/podman/stable:latest sh -s <test/e2e/podman-acceptance/harness/netprobe.sh >"$RESULTS_DIR/probe/netprobe.txt" 2>&1 || true
          cat "$RESULTS_DIR/probe/netprobe.txt"
          sudo chmod -R a+r /tmp/runsc-logs
          cd /tmp/runsc-logs
          grep -rhE 'errno=' . 2>/dev/null | grep -E 'sendmsg|sendto|recvmsg|setns|unshare|mount|socket\(|setsockopt' | grep -vE 'errno=(2|11) ' | cut -c1-400 | head -150 >"$RESULTS_DIR/probe/netprobe-errors.txt" || true
          grep -rhE 'nl_msg|NLM_|RTM_|NFNL|nfnetlink' . 2>/dev/null | head -100 | cut -c1-400 >"$RESULTS_DIR/probe/netprobe-nlmsgs.txt" || true
          grep -rhoE 'socket\(AF_NETLINK[^)]*\)[^ ]* *[^ ]*' . | sort | uniq -c | sort -rn | head -40 >"$RESULTS_DIR/probe/netlink-sockets.txt" || true
          grep -rhE 'AF_NETLINK|sendmsg|sendto' . 2>/dev/null | grep -iE 'netlink|NETLINK' | head -300 >"$RESULTS_DIR/probe/netlink-lines.txt" || true
          grep -rhE 'EPROTONOSUPPORT|EOPNOTSUPP|ENOTSUP|EINVAL|ENOSYS|EPERM' . 2>/dev/null | grep -E 'sendmsg|sendto|socket|setsockopt|bind' | head -200 >"$RESULTS_DIR/probe/errors.txt" || true
          grep -rhE 'Unsupported|unsupported|not implemented' . 2>/dev/null | head -100 >"$RESULTS_DIR/probe/unsupported.txt" || true
          cat "$RESULTS_DIR/probe/netlink-sockets.txt"; head -60 "$RESULTS_DIR/probe/errors.txt"; head -40 "$RESULTS_DIR/probe/unsupported.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: netlink-probe, path: results, retention-days: 30}

  # Round 2: what is behind the first gap. Stock runsc with its --TESTONLY-nftables flag (opens
  # NETLINK_NETFILTER) and an LD_PRELOAD shim that swallows ENOPROTOOPT for SOL_NETLINK sockopts in netavark.
  probe2:
    name: probe2-${{ matrix.podman }}-${{ matrix.v }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        podman: ["v5.7.1", "v6.2.0"]
        v: [nft-shim, nft-shim-cgroupfs]
    steps:
      - uses: actions/checkout@v4
        with: {sparse-checkout: "test/e2e"}
      - run: mkdir -p "$RESULTS_DIR/out" && test/e2e/podman-acceptance/harness/install.sh
      - name: Build shim
        run: gcc -Wall -shared -fPIC -O2 -o /tmp/shim.so test/e2e/podman-acceptance/harness/shim.c -ldl
      - name: Start engine
        run: |
          export SHARE_DIR=/tmp/acc-share STORAGE=hostdir PODMAN_IMAGE=quay.io/podman/stable:${{ matrix.podman }} CGROUPS=disabled
          export RUNTIME=runsc-nft-strace
          case "${{ matrix.v }}" in
            nft-shim) export SHIM=1 SHIM_SO=/tmp/shim.so ;;
            nft-shim-cgroupfs) export SHIM=1 SHIM_SO=/tmp/shim.so CGROUPS=enabled REMOUNT_CG=1 ;;
            nft-only) ;;
            slirp) export INSTALL_SLIRP=1 ;;
            cgfs-host) export CGROUPS=enabled REMOUNT_CG=1 RUNTIME=runsc ;;
          esac
          test/e2e/podman-acceptance/harness/engine-runsc.sh start
          docker exec podman-in-runsc podman version | tee "$RESULTS_DIR/out/engine-version.txt"
      - name: Acceptance test
        run: |
          export SHARE_DIR=/tmp/acc-share RESULTS_DIR="$RESULTS_DIR/out" STORAGE=hostdir RUNTIME=runsc-nft-strace
          export CONTAINER_HOST=unix:///tmp/podman-runsc.sock
          export ENGINE_CTL="$PWD/test/e2e/podman-acceptance/harness/engine-runsc.sh"
          [ "${{ matrix.v }}" = slirp ] && export NETARGS=--network=slirp4netns
          if [ "${{ matrix.v }}" = cgfs-host ]; then export HOSTNET=1 NETARGS=--network=host RUNTIME=runsc CGROUPS=enabled REMOUNT_CG=1 PODMAN_IMAGE=quay.io/podman/stable:${{ matrix.podman }}; fi
          if [ "${{ matrix.v }}" = cgfs-host ]; then test/e2e/podman-acceptance/run.sh || true; else ONLY="1 2 3 6 7 8 10" test/e2e/podman-acceptance/run.sh || true; fi
      - name: Diagnostics
        if: always()
        run: |
          cd "$RESULTS_DIR/out"
          docker logs podman-in-runsc >engine-container.log 2>&1 || true
          docker exec podman-in-runsc sh -c "tail -c 400000 /var/log/netavark.log" >netavark.tail 2>&1 || true
          sudo chmod -R a+r /tmp/runsc-logs
          ( cd /tmp/runsc-logs; grep -rh 'W1.*\(netlink\|link info\|unexpected\|attribute\)' . | cut -c1-400 | head -100 ) >gvisor-netlink-warnings.txt || true
          ( cd /tmp/runsc-logs; grep -rhE ' (netavark|nft|iptables|exe) [XE] ' . | grep -E 'NETLINK|errno=(92|93|94|95|97|22|38|1|13) ' | grep -E 'socket|setsockopt|sendmsg|sendto|setns|mount|bind' | cut -c1-350 | head -200 ) >netlink-errors.txt || true
          ( cd /tmp/runsc-logs; grep -rh 'Unsupported syscall\|unexpected attribute\|not supported\|unimplemented' . | cut -c1-300 | sort | uniq -c | sort -rn | head -40 ) >gvisor-warnings.txt || true
          { echo "### probe2-${{ matrix.podman }}-${{ matrix.v }}"; echo '```'; grep -E '^Version' engine-version.txt; cat steps.txt; echo '```'; } >>"$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe2-${{ matrix.podman }}-${{ matrix.v }}
          path: results/out
          retention-days: 30

  # runsc built from this tree: strict bar (default bridge, -p, compose names, default cgroup manager).
  # v: ipt-priv = docker --privileged (rw cgroup mount), ipt-remount = unprivileged plus in-sandbox remount rw.
  bridge:
    name: bridge-${{ matrix.podman }}-${{ matrix.v }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - {podman: "v5.7.1", v: ipt-priv}
          - {podman: "v6.2.0", v: nft-priv}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod}
      - run: mkdir -p "$RESULTS_DIR/out" && BUILD_RUNSC=1 PODMAN_IMAGE=quay.io/podman/stable:${{ matrix.podman }} test/e2e/podman-acceptance/harness/install.sh
      - name: Kernel-behaviour checks (nlcheck)
        run: |
          CGO_ENABLED=0 go build -o /tmp/nlcheck ./test/e2e/podman-acceptance/harness/nlcheck
          docker run --rm --runtime runsc-fix --cap-add NET_ADMIN -v /tmp/nlcheck:/nlcheck:ro --entrypoint /nlcheck mirror.gcr.io/library/alpine:3.20 | tee "$RESULTS_DIR/out/nlcheck.txt" || true
      - name: nft statement probe
        if: matrix.v == 'nft-priv'
        run: |
          docker run --rm -i --runtime runsc-nft --cap-add NET_ADMIN --user root --entrypoint '' quay.io/podman/stable:${{ matrix.podman }} sh -s <test/e2e/podman-acceptance/harness/nftprobe.sh 2>&1 | tee "$RESULTS_DIR/out/nftprobe.txt" || true
      - name: Start engine
        run: |
          export SHARE_DIR=/tmp/acc-share STORAGE=hostdir PODMAN_IMAGE=quay.io/podman/stable:${{ matrix.podman }} CGROUPS=enabled RUNTIME=runsc-fix-strace NETAVARK_TRACE=1 PRIVILEGED=1
          [ "${{ matrix.v }}" = ipt-priv ] && export FW=iptables
          [ "${{ matrix.v }}" = nft-priv ] && export RUNTIME=runsc-nft-strace
          test/e2e/podman-acceptance/harness/engine-runsc.sh start
          docker exec podman-in-runsc podman version | tee "$RESULTS_DIR/out/engine-version.txt"
      - name: Acceptance test (strict)
        run: |
          export SHARE_DIR=/tmp/acc-share RESULTS_DIR="$RESULTS_DIR/out" STORAGE=hostdir RUNTIME=runsc-fix-strace CGROUPS=enabled NETAVARK_TRACE=1 PRIVILEGED=1
          [ "${{ matrix.v }}" = ipt-priv ] && export FW=iptables
          [ "${{ matrix.v }}" = nft-priv ] && export RUNTIME=runsc-nft-strace
          export PODMAN_IMAGE=quay.io/podman/stable:${{ matrix.podman }}
          export CONTAINER_HOST=unix:///tmp/podman-runsc.sock
          export ENGINE_CTL="$PWD/test/e2e/podman-acceptance/harness/engine-runsc.sh"
          test/e2e/podman-acceptance/run.sh || true
      - name: Diagnostics
        if: always()
        run: |
          cd "$RESULTS_DIR/out"
          docker logs podman-in-runsc >engine-container.log 2>&1 || true
          docker exec podman-in-runsc sh -c "tail -c 300000 /var/log/netavark.log" >netavark.tail 2>&1 || true
          docker exec podman-in-runsc sh -c "grep cgroup /proc/mounts; iptables -t nat -S; iptables -S; nft list ruleset; cat /proc/net/dev" >sandbox-state.txt 2>&1 || true
          docker inspect podman-in-runsc --format 'privileged={{.HostConfig.Privileged}} cgroupns={{.HostConfig.CgroupnsMode}}' >>sandbox-state.txt 2>&1 || true
          sudo chmod -R a+r /tmp/runsc-logs
          ( cd /tmp/runsc-logs; grep -rhE 'W1[0-9]+ .*(unexpected|netfilter|iptables|bridge|veth)|errno=(22|92|93|95|97) ' . | grep -E 'NETLINK|netlink|unexpected|iptables|IPT|bridge|veth|sendmsg|setsockopt|getsockopt' | cut -c1-400 | head -300 ) >gvisor-netlink.txt || true
          { echo "### bridge-${{ matrix.podman }}-${{ matrix.v }}"; echo '```'; grep -E '^Version' engine-version.txt; cat nlcheck.txt; cat steps.txt; echo '```'; } >>"$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bridge-${{ matrix.podman }}-${{ matrix.v }}
          path: results/out
          retention-days: 30

  # Stage C: native vs runc vs runsc
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {sparse-checkout: "test/e2e/podman-acceptance/harness"}
      - run: mkdir -p "$RESULTS_DIR" && test/e2e/podman-acceptance/harness/install.sh
      - run: test/e2e/podman-acceptance/harness/bench.sh
      - run: |
          { echo "### bench"; echo '```'; column -t -s $'\t' "$RESULTS_DIR/bench.tsv"; echo '```'; } >>"$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with: {name: bench, path: results, retention-days: 30}

  # Stage D: ELF survey (no runsc needed)
  elf:
    name: elf-${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        image: [alpine, debian, python, node]
    steps:
      - uses: actions/checkout@v4
        with: {sparse-checkout: "test/e2e/podman-acceptance/harness"}
      - run: |
          mkdir -p results
          img=mirror.gcr.io/library/${{ matrix.image }}:$( case ${{ matrix.image }} in alpine) echo 3.20;; debian) echo 12;; python) echo 3;; node) echo lts;; esac )
          docker pull -q "$img"
          cid=$(docker create "$img" true)
          docker export "$cid" | python3 test/e2e/podman-acceptance/harness/elf-survey.py "${{ matrix.image }}" | tee results/elf.json
          python3 -m json.tool results/elf.json >>"$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        with: {name: "elf-${{ matrix.image }}", path: results, retention-days: 30}

  # Stage E: image storage (gate 0a.4)
  storage:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: {sparse-checkout: "test/e2e/podman-acceptance/harness"}
      - run: mkdir -p "$RESULTS_DIR" && test/e2e/podman-acceptance/harness/install.sh
      - run: test/e2e/podman-acceptance/harness/storage-test.sh
      - if: always()
        run: |
          { echo "### storage"; echo '```'; column -t -s $'\t' "$RESULTS_DIR/storage.tsv"; cat "$RESULTS_DIR/overlay-dir.txt"; echo '```'; } >>"$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: storage, path: results, retention-days: 30}

  summary:
    needs: [acceptance, strict, netlink-probe, probe2, bench, elf, storage]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {sparse-checkout: "test/e2e/podman-acceptance/harness"}
      - uses: actions/download-artifact@v4
        with: {path: all}
      - run: |
          python3 test/e2e/podman-acceptance/harness/summarize.py all | tee summary.md >>"$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with: {name: summary, path: summary.md, retention-days: 30}
