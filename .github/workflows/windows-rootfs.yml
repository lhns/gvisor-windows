# Called by ci.yml on push; dispatch it alone with `gh workflow run windows-rootfs --ref <branch>`.
name: windows-rootfs

on:
  workflow_call:
    inputs:
      prebuilt: {type: boolean, default: false}
  workflow_dispatch:

concurrency:
  group: windows-rootfs-${{ github.ref }}-${{ inputs.prebuilt && 'ci' || 'solo' }}
  cancel-in-progress: true

env:
  CGO_ENABLED: "0"

jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The images depend only on these scripts and the image tags below (bump v2 to rebuild:
      # podman/stable:latest floats).
      # the key is the git object ids of the inputs, not hashFiles: CRLF checkouts on Windows hash differently
      - id: key
        shell: bash
        run: echo "key=rootfs-images-v2-$(git rev-parse HEAD:tools/windows/mkrootfs.sh HEAD:tools/windows/synth-xattrs.sh | tr -d '\n')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: cache
        with:
          path: |
            out
            out-versions.txt
          key: ${{ steps.key.outputs.key }}
          enableCrossOsArchive: true   # the Windows job restores it
      - name: Tools
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq erofs-utils attr libcap2-bin
          mkfs.erofs --version || true
          dpkg -s erofs-utils | grep Version
          podman --version
      - name: Images from OCI images
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          out=$PWD/out
          for spec in alpine=docker.io/library/alpine:3.20 podman=quay.io/podman/stable:latest; do
            name=${spec%%=*}; image=${spec#*=}
            podman pull -q "$image"
            echo "$name: $(podman image inspect "$image" --format '{{.Id}} {{.Digest}}')" | tee -a out-versions.txt
            c=$(podman create "$image" sh)
            sudo rm -rf /tmp/root-$name && mkdir /tmp/root-$name
            podman export "$c" | sudo tar -x -C /tmp/root-$name --numeric-owner --same-owner -p --xattrs --xattrs-include="*"
            podman rm "$c" >/dev/null
            sudo bash tools/windows/mkrootfs.sh "$name" /tmp/root-$name "$out"
            sudo rm -rf /tmp/root-$name
          done
      - name: Synthetic tree with every file kind
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          r=/tmp/root-synth; sudo rm -rf $r; sudo mkdir -p $r/etc $r/dev $r/synth/big $r/synth/sub
          sudo bash -c "
            cd $r
            echo 'NAME=synth' > etc/os-release
            echo data > synth/file-0
            ln synth/file-0 synth/hardlink
            ln -s file-0 synth/rel-link; ln -s /abs/target synth/abs-link; ln -s missing synth/dangling
            install -m 4755 -o 1000 -g 1001 /dev/null synth/setuid
            install -m 0600 -o 1234 -g 5678 /dev/null synth/private
            mknod dev/null c 1 3; mknod dev/sda b 8 0; mkfifo dev/fifo
            python3 -c 'import socket;s=socket.socket(socket.AF_UNIX);s.bind(\"synth/sock\")'
            head -c 70000000 /dev/urandom > synth/large
            for i in \$(seq 1 20000); do : > synth/big/entry-\$i; done
            chmod 1777 synth/sub
          "
          sudo bash tools/windows/synth-xattrs.sh $r
          sudo bash tools/windows/mkrootfs.sh synth $r "$PWD/out"
  mount:
    needs: images
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/winbin
        with: {prebuilt: "${{ inputs.prebuilt }}", targets: rootfs}
      # the key is the git object ids of the inputs, not hashFiles: CRLF checkouts on Windows hash differently
      - id: key
        shell: bash
        run: echo "key=rootfs-images-v2-$(git rev-parse HEAD:tools/windows/mkrootfs.sh HEAD:tools/windows/synth-xattrs.sh | tr -d '\n')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        with:
          path: |
            out
            out-versions.txt
          key: ${{ steps.key.outputs.key }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - name: Mount each image with an overlay and check it through the VFS
        shell: bash
        run: |
          set +e
          ls -la out 2>/dev/null | head -30
          (cd pkg/sentry/fsimpl/rootfs && GVISOR_EROFS_DIR="$GITHUB_WORKSPACE/out" C:/ci/bin/rootfs.test.exe -test.count=1 -test.v -test.timeout=1500s) > rootfs.log 2>&1
          rc=$?
          grep -E "^(\s*--- |FAIL|ok|PASS|panic|fatal)|_test.go:[0-9]+:|^goroutine|\.go:[0-9]+ " rootfs.log | head -150
          { echo '### rootfs mount tests'; echo '```'; grep -E "^(\s*--- |FAIL|ok|PASS|panic|fatal)" rootfs.log | head -150; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $rc
