# Phase 1d: the real Sentry on Windows runs static Linux guests from an in-memory
# tmpfs on the winstub platform (tools/windows/sentryguest).
name: windows-sentry-guests
on:
  push:
    paths: ["pkg/**", "runsc/**", "third_party/**", "tools/windows/**", "test/guests/**", "go.mod", ".github/workflows/windows-sentry-guests.yml"]
  workflow_dispatch:
jobs:
  guests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: test/guests
      - uses: actions/setup-go@v5
        with: {go-version: "1.26.x", cache: false}
      - name: Build guests
        run: |
          G=test/guests
          mkdir -p out
          gcc -nostdlib -static -no-pie -o out/hello_asm $G/hello.S
          gcc -nostdlib -static -no-pie -o out/bench_asm $G/bench.S
          gcc -nostdlib -static -no-pie -o out/getpid_asm $G/getpid.S
          docker run --rm -v "$PWD:/w" -w /w debian:bookworm sh -c 'apt-get update -qq && apt-get install -y -qq gcc libc6-dev >/dev/null && sh test/guests/build-glibc.sh out all'
          (cd $G/gohello && CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o $GITHUB_WORKSPACE/out/hello_go .)
          (cd $G/gospin && CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o $GITHUB_WORKSPACE/out/gospin_go .)
          # Dynamic, exec, shell, signal and thread guests run from a root filesystem tar.
          sudo apt-get update -qq && sudo apt-get install -y busybox-static
          (cd $G/gostress && CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o $GITHUB_WORKSPACE/out/gostress .)
          (cd $G/gopodman && CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o $GITHUB_WORKSPACE/out/gopodman .)
          docker run --rm -v "$PWD:/w" -w /w alpine:3.20 sh -c             'apk add --no-cache gcc musl-dev >/dev/null && gcc -O1 -fstack-protector-all -o out/hello_musl test/guests/hello.c && cp -L /lib/ld-musl-x86_64.so.1 out/ld-musl'
          R=root
          mkdir -p $R/bin $R/lib $R/lib64 $R/t
          cp out/clonesys out/clonesys_ns out/hello_dyn out/hello_dyn_nopie out/dlopen_glibc out/exec out/signals out/threads out/threads_dyn out/gostress out/gopodman out/hello_musl $R/bin/
          cp out/libplug.so $R/lib/
          cp out/ld-musl $R/lib/ld-musl-x86_64.so.1
          ln -s ld-musl-x86_64.so.1 $R/lib/libc.musl-x86_64.so.1
          docker run --rm -v "$PWD:/w" -w /w debian:bookworm sh -c 'apt-get update -qq && apt-get install -y -qq busybox-static >/dev/null && cp /bin/busybox out/busybox'
          cp out/busybox $R/bin/busybox
          for a in sh cat wc sort uniq grep sed sleep kill true false echo printf; do ln -s busybox $R/bin/$a; done
          cp -a out/glibclibs/. $R/
          cp $G/t/*.sh $R/t/
          find $R | sort | head -60
          tar -C $R -cf out/rootfs.tar .
          ls -l out/rootfs.tar
          file out/*
      - uses: actions/upload-artifact@v4
        with: {name: guests, path: out}
  run:
    needs: guests
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [native, rewrite, rewrite-fxsave]
    env:
      WINSTUB_FSMODE: ${{ matrix.mode == 'native' && 'native' || 'rewrite' }}
      WINSTUB_FPMODE: ${{ matrix.mode == 'rewrite-fxsave' && 'fxsave' || '' }}
      WINSTUB_KEEP_AVX512: ${{ matrix.mode == 'rewrite' && '1' || '' }}
      WINSTUB_TRIPWIRE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod, cache: false}
      - uses: actions/download-artifact@v4
        with: {name: guests, path: out}
      - name: Build
        shell: pwsh
        run: |
          go vet ./tools/windows/sentryguest
          go build -o sentryguest.exe ./tools/windows/sentryguest
      - name: Guests
        shell: pwsh
        run: |
          $fail = 0
          $nl = "`n"
          $cases = @(
            @{n='bench_asm'; out="bench done${nl}"; code=0},
            @{n='getpid_asm'; out="bench done${nl}"; code=0},
            @{n='hello_asm'; out="hello from asm${nl}ud2 path ok${nl}"; code=0},
            @{n='hello_glibc'; out="hello from glibc: argc=1 tv=5 work=10 heap=ok${nl}"; code=7},
            @{n='hello_glibc_pie'; out="hello from glibc: argc=1 tv=5 work=10 heap=ok${nl}"; code=7},
            @{n='fork_glibc'; out="child${nl}parent: child exited 3${nl}"; code=0},
            @{n='hello_go'; out="hello from go${nl}"; code=0},
            @{n='gospin_go'; out="gospin ok${nl}"; code=0},
            @{n='jit_glibc'; out="jit1 ok${nl}jit2 ok${nl}jit3 ok${nl}"; code=0}
          )
          # clone() through a register-number site (veneer): the child resumes at the return address.
          $known = @(@{n='clonesys'; a=@('/bin/clonesys'); out="child${nl}parent: child exited 3${nl}"; code=0}, @{n='clonesys_ns'; a=@('/bin/clonesys','ns'); out="child${nl}parent: child exited 3${nl}"; code=0})
          foreach ($k in $known) { $k.tar = $true }
          $hello = "hello from glibc: argc=1 tv=5 work=10 heap=ok${nl}"
          $tcases = @(
            @{n='dyn_glibc'; a=@('/bin/hello_dyn'); out=$hello; code=7},
            @{n='dyn_glibc_nopie'; a=@('/bin/hello_dyn_nopie'); out=$hello; code=7},
            @{n='dyn_musl'; a=@('/bin/hello_musl'); out=$hello; code=7},
            @{n='dlopen_glibc'; a=@('/bin/dlopen_glibc'); out="dlopen ok: plug=46 tls=8 cos=1.0${nl}"; code=0},
            @{n='exec_chain'; a=@('/bin/exec','chain','1'); out="level 1: argc=3 argv0=/bin/exec FOO=(unset) auxv=ok${nl}level 2: argc=3 argv0=renamed FOO=lvl2 auxv=ok${nl}level 3: argc=3 argv0=renamed FOO=lvl3 auxv=ok${nl}"; code=0},
            @{n='fork_exec'; a=@('/bin/exec','forkexec'); out="child: argc=4 a2=a b a3=c X=1 auxv=ok${nl}forkexec: waited=1 exited=1 status=9${nl}forkexec: enoent child status=11${nl}forkexec: sum=6 wait=-1 errno_echild=1${nl}"; code=0},
            @{n='sh_pipes'; a=@('/bin/busybox','sh','-c','echo a | cat; echo $((1+2)); for i in 1 2 3; do echo $i; done | wc -l'); out="a${nl}3${nl}3${nl}"; code=0},
            @{n='sh_pipeline_tools'; a=@('/bin/busybox','sh','/t/pipes.sh'); out="a${nl}X${nl}done${nl}"; code=0},
            @{n='sh_wait_status'; a=@('/bin/busybox','sh','/t/wait.sh'); out="st=3${nl}Terminated${nl}sig=143${nl}Terminated${nl}bg=143${nl}pipe=2${nl}done${nl}"; code=0},
            @{n='sig_self'; a=@('/bin/signals','self'); out="self ok${nl}"; code=0},
            @{n='sig_alarm'; a=@('/bin/signals','alarm'); out="alarm ok${nl}"; code=0},
            @{n='sig_segv'; a=@('/bin/signals','segv'); out="segv ok${nl}"; code=0},
            @{n='sig_altstack'; a=@('/bin/signals','altstack'); out="altstack ok${nl}"; code=0},
            @{n='sig_ctx'; a=@('/bin/signals','ctx'); out="ctx ok${nl}"; code=0},
            @{n='sig_eintr'; a=@('/bin/signals','eintr'); out="eintr ok${nl}"; code=0},
            @{n='sig_child'; a=@('/bin/signals','child'); out="child ok${nl}"; code=0},
            @{n='sig_group'; a=@('/bin/signals','group'); out="group ok${nl}"; code=0},
            @{n='threads_static'; a=@('/bin/threads'); out="threads: counter=160000 idsum=28 main_tls=1${nl}"; code=0},
            @{n='threads_dyn'; a=@('/bin/threads_dyn'); out="threads: counter=160000 idsum=28 main_tls=1${nl}"; code=0},
            @{n='go_stress'; a=@('/bin/gostress'); out="gostress ok: ticks=20 sum=507500 spun=true procs=4${nl}"; code=0}
          )
          foreach ($t in $tcases) { $t.tar = $true }
          $cases += $tcases
          $cases += $known
          foreach ($c in $cases) {
            "===== $($c.n)" | Tee-Object -Append -FilePath guests.txt
            $a = @("-check", "-out=$($c.out)", "-code=$($c.code)", "-timeout=120s")
            if ($c.tar) { $a += "-tar=out/rootfs.tar"; $a += $c.a } else { $a += "out/$($c.n)" }
            & ./sentryguest.exe @a 2>&1 | Tee-Object -Append -FilePath guests.txt
            "exit: $LASTEXITCODE" | Tee-Object -Append -FilePath guests.txt
            if ($LASTEXITCODE -ne 0 -and -not $c.known) { $fail = 1 }
          }
          exit $fail
      - name: Podman-shaped stress
        shell: pwsh
        run: |
          $fail = 0
          foreach ($pol in 'tokens', 'limit', 'always') {
            $env:WINSTUB_POLICY = $pol
            "===== gopodman, spin policy $pol" | Tee-Object -Append -FilePath podman.txt
            $o = & ./sentryguest.exe "-tar=out/rootfs.tar" "-timeout=60s" /bin/gopodman 2>&1 | Out-String
            $o | Tee-Object -Append -FilePath podman.txt
            if ($o -notmatch 'gopodman ok' -or $LASTEXITCODE -ne 0) { "FAILED with policy $pol"; $fail = 1 }
          }
          exit $fail
      - name: Hunt for hangs (limit policy)
        timeout-minutes: 15
        if: always() && matrix.mode == 'native'
        continue-on-error: true
        shell: pwsh
        run: |
          foreach ($pol in 'limit') {
            $env:WINSTUB_POLICY = $pol
            for ($i = 0; $i -lt 40; $i++) {
              $o = & ./sentryguest.exe "-tar=out/rootfs.tar" "-timeout=20s" /bin/gopodman 2>&1 | Out-String
              if ($o -notmatch 'gopodman ok') { "===== $pol run $i hung or failed" | Tee-Object -Append -FilePath hang.txt; $o | Tee-Object -Append -FilePath hang.txt }
              else { "$pol run $i ok" | Tee-Object -Append -FilePath hang.txt }
            }
          }
      - name: Diagnose dlopen (debug log)
        if: always() && matrix.mode != 'native'
        continue-on-error: true
        env: {WINSTUB_DEBUG: "1"}
        shell: pwsh
        run: |
          $o = & ./sentryguest.exe "-tar=out/rootfs.tar" "-timeout=60s" /bin/dlopen_glibc 2>&1 | Out-String
          $o -split "`n" | Where-Object { $_ -match 'fault|signal|unsupported|exception|illegal|unexpected' -and $_ -notmatch 'ud2 site' } | Select-Object -Last 150 | Tee-Object -Append -FilePath diag.txt
      - name: Timing
        continue-on-error: true
        shell: pwsh
        run: |
          foreach ($n in "hello_asm","hello_glibc","fork_glibc","hello_go") {
            $t = @()
            for ($i = 0; $i -lt 9; $i++) {
              $o = & ./sentryguest.exe "-code=$(if ($n -eq 'hello_glibc') {7} else {0})" "out/$n" 2>&1 | Out-String
              if ($o -match 'run ([0-9.]+)(ms|s)') { $v = [double]$Matches[1]; if ($Matches[2] -eq 's') { $v *= 1000 }; $t += $v }
            }
            $t = $t | Sort-Object
            "TIMING $n median $($t[4]) ms (min $($t[0]), max $($t[8])) all: $($t -join ' ')" | Tee-Object -Append -FilePath timing.txt
          }
      - name: Timing, both modes on this machine
        if: matrix.mode == 'native'
        continue-on-error: true
        shell: pwsh
        run: |
          foreach ($round in 1..2) {
          foreach ($m in 'native', 'rewrite') {
            $env:WINSTUB_FSMODE = $m
            foreach ($n in "hello_asm","hello_glibc","fork_glibc","hello_go") {
              $t = @()
              for ($i = 0; $i -lt 9; $i++) {
                $o = & ./sentryguest.exe "-code=$(if ($n -eq 'hello_glibc') {7} else {0})" "out/$n" 2>&1 | Out-String
                if ($o -match 'run ([0-9.]+)(ms|s)') { $v = [double]$Matches[1]; if ($Matches[2] -eq 's') { $v *= 1000 }; $t += $v }
              }
              $t = $t | Sort-Object
              "TIMING2 $m $n median $($t[4]) ms (min $($t[0]), max $($t[8]))" | Tee-Object -Append -FilePath timing.txt
            }
            $o = & ./sentryguest.exe "-tar=out/rootfs.tar" "-timeout=60s" /bin/gopodman 2>&1 | Out-String
            if ($o -match '(gopodman: \d+ syscall-level ops[^\n]*)') { "TIMING2 $m $($Matches[1])" | Tee-Object -Append -FilePath timing.txt }
            if ($o -match '(gopodman: 50 children[^\n]*)') { "TIMING2 $m $($Matches[1])" | Tee-Object -Append -FilePath timing.txt }
          }
          }
      - name: Trace
        if: always() && matrix.mode == 'native'
        continue-on-error: true
        shell: pwsh
        env: {WINSTUB_TRACE: "1"}
        run: |
          foreach ($n in "hello_asm","hello_glibc","fork_glibc") {
            "===== trace $n" | Tee-Object -Append -FilePath trace.txt
            & ./sentryguest.exe "-sample" "-timeout=90s" "-code=$(if ($n -eq 'hello_glibc') {7} else {0})" "out/$n" 2>&1 | Tee-Object -Append -FilePath trace.txt
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: "sentry-guests-output-${{ matrix.mode }}", path: "guests.txt\ntrace.txt\ntiming.txt\npodman.txt\nhang.txt"}
