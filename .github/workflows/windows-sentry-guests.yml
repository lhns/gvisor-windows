# Phase 1d: the real Sentry on Windows runs static Linux guests from an in-memory
# tmpfs on the winstub platform (tools/windows/sentryguest). The three legs run in a
# loop in one job. Called by ci.yml on push; dispatch it alone with
# `gh workflow run windows-sentry-guests --ref <branch> -f only=<case regexp> -f legs=native`.
name: windows-sentry-guests
on:
  workflow_call:
    inputs:
      prebuilt: {type: boolean, default: false}
      only: {type: string, default: ''}
      legs: {type: string, default: ''}
  workflow_dispatch:
    inputs:
      only: {description: 'regexp of the guest case names to run, e.g. fork|sig_ (default all, and the stress/timing steps)', default: ''}
      legs: {description: 'comma list of legs: native, rewrite, rewrite-fxsave (default all)', default: ''}
      iterations: {description: 'runs of each selected case (more than 1: also the wait diagnosis step)', default: '1'}
concurrency:
  group: windows-sentry-guests-${{ github.ref }}-${{ inputs.prebuilt && 'ci' || 'solo' }}
  cancel-in-progress: true
env:
  WINSTUB_TRIPWIRE: '1'
  LEGS: ${{ inputs.legs || 'native,rewrite,rewrite-fxsave' }}
  ONLY: ${{ inputs.only }}
  ITER: ${{ inputs.iterations || '1' }}
jobs:
  guests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: test/guests
      # The guests depend only on test/guests (bump v1 to rebuild: the base images float).
      - uses: actions/cache@v4
        id: cache
        with:
          path: out
          key: sentry-guests-v1-${{ hashFiles('test/guests/**') }}
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@v5
        with: {go-version: "1.26.x", cache: false}
      - name: Build guests
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          G=test/guests
          mkdir -p out
          gcc -nostdlib -static -no-pie -o out/hello_asm $G/hello.S
          gcc -nostdlib -static -no-pie -o out/bench_asm $G/bench.S
          gcc -nostdlib -static -no-pie -o out/getpid_asm $G/getpid.S
          docker run --rm -v "$PWD:/w" -w /w debian:bookworm sh -c 'apt-get update -qq && apt-get install -y -qq gcc libc6-dev >/dev/null && sh test/guests/build-glibc.sh out all'
          (cd $G/gohello && CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o $GITHUB_WORKSPACE/out/hello_go .)
          (cd $G/gospin && CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o $GITHUB_WORKSPACE/out/gospin_go .)
          # Dynamic, exec, shell, signal and thread guests run from a root filesystem tar.
          sudo apt-get update -qq && sudo apt-get install -y busybox-static
          (cd $G/gostress && CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o $GITHUB_WORKSPACE/out/gostress .)
          (cd $G/gopodman && CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o $GITHUB_WORKSPACE/out/gopodman .)
          docker run --rm -v "$PWD:/w" -w /w alpine:3.20 sh -c             'apk add --no-cache gcc musl-dev >/dev/null && gcc -O1 -fstack-protector-all -o out/hello_musl test/guests/hello.c && cp -L /lib/ld-musl-x86_64.so.1 out/ld-musl'
          R=root
          mkdir -p $R/bin $R/lib $R/lib64 $R/t
          cp out/clonesys out/clonesys_ns out/hello_dyn out/hello_dyn_nopie out/dlopen_glibc out/exec out/signals out/clocks out/threads out/threads_dyn out/gostress out/gopodman out/hello_musl $R/bin/
          cp out/libplug.so $R/lib/
          cp out/ld-musl $R/lib/ld-musl-x86_64.so.1
          ln -s ld-musl-x86_64.so.1 $R/lib/libc.musl-x86_64.so.1
          docker run --rm -v "$PWD:/w" -w /w debian:bookworm sh -c 'apt-get update -qq && apt-get install -y -qq busybox-static >/dev/null && cp /bin/busybox out/busybox'
          cp out/busybox $R/bin/busybox
          for a in sh cat wc sort uniq grep sed sleep kill true false echo printf; do ln -s busybox $R/bin/$a; done
          cp -a out/glibclibs/. $R/
          cp $G/t/*.sh $R/t/
          find $R | sort | head -60
          tar -C $R -cf out/rootfs.tar .
          ls -l out/rootfs.tar
          file out/*
      - uses: actions/upload-artifact@v4
        with: {name: guests, path: out}
  run:
    needs: guests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {name: guests, path: out}
      - uses: ./.github/actions/winbin
        with: {prebuilt: "${{ inputs.prebuilt }}", targets: sentryguest}
      - name: Guests
        shell: pwsh
        run: |
          . tools/windows/ci/leg.ps1
          Copy-Item C:\ci\bin\sentryguest.exe sentryguest.exe
          $nl = "`n"
          $cases = @(
            @{n='bench_asm'; out="bench done${nl}"; code=0},
            @{n='getpid_asm'; out="bench done${nl}"; code=0},
            @{n='hello_asm'; out="hello from asm${nl}ud2 path ok${nl}"; code=0},
            @{n='hello_glibc'; out="hello from glibc: argc=1 tv=5 work=10 heap=ok${nl}"; code=7},
            @{n='hello_glibc_pie'; out="hello from glibc: argc=1 tv=5 work=10 heap=ok${nl}"; code=7},
            @{n='fork_glibc'; out="child${nl}parent: child exited 3${nl}"; code=0},
            @{n='hello_go'; out="hello from go${nl}"; code=0},
            @{n='gospin_go'; out="gospin ok${nl}"; code=0},
            @{n='jit_glibc'; out="jit1 ok${nl}jit2 ok${nl}jit3 ok${nl}"; code=0}
          )
          # clone() through a register-number site (veneer): the child resumes at the return address.
          $known = @(@{n='clonesys'; a=@('/bin/clonesys'); out="child${nl}parent: child exited 3${nl}"; code=0}, @{n='clonesys_ns'; a=@('/bin/clonesys','ns'); out="child${nl}parent: child exited 3${nl}"; code=0})
          foreach ($k in $known) { $k.tar = $true }
          $hello = "hello from glibc: argc=1 tv=5 work=10 heap=ok${nl}"
          $tcases = @(
            @{n='dyn_glibc'; a=@('/bin/hello_dyn'); out=$hello; code=7},
            @{n='dyn_glibc_nopie'; a=@('/bin/hello_dyn_nopie'); out=$hello; code=7},
            @{n='dyn_musl'; a=@('/bin/hello_musl'); out=$hello; code=7},
            @{n='dlopen_glibc'; a=@('/bin/dlopen_glibc'); out="dlopen ok: plug=46 tls=8 cos=1.0${nl}"; code=0},
            @{n='exec_chain'; a=@('/bin/exec','chain','1'); out="level 1: argc=3 argv0=/bin/exec FOO=(unset) auxv=ok${nl}level 2: argc=3 argv0=renamed FOO=lvl2 auxv=ok${nl}level 3: argc=3 argv0=renamed FOO=lvl3 auxv=ok${nl}"; code=0},
            @{n='fork_exec'; a=@('/bin/exec','forkexec'); out="child: argc=4 a2=a b a3=c X=1 auxv=ok${nl}forkexec: waited=1 exited=1 status=9${nl}forkexec: enoent child status=11${nl}forkexec: sum=6 wait=-1 errno_echild=1${nl}"; code=0},
            @{n='sh_pipes'; a=@('/bin/busybox','sh','-c','echo a | cat; echo $((1+2)); for i in 1 2 3; do echo $i; done | wc -l'); out="a${nl}3${nl}3${nl}"; code=0},
            @{n='sh_pipeline_tools'; a=@('/bin/busybox','sh','/t/pipes.sh'); out="a${nl}X${nl}done${nl}"; code=0},
            @{n='sh_wait_status'; flags=@('-sysmounts'); a=@('/bin/busybox','sh','/t/wait.sh'); out="st=3${nl}Terminated${nl}sig=143${nl}bg=143${nl}pipe=2${nl}done${nl}"; code=0},
            @{n='sig_self'; a=@('/bin/signals','self'); out="self ok${nl}"; code=0},
            @{n='sig_alarm'; a=@('/bin/signals','alarm'); out="alarm ok${nl}"; code=0},
            @{n='sig_segv'; a=@('/bin/signals','segv'); out="segv ok${nl}"; code=0},
            @{n='sig_altstack'; a=@('/bin/signals','altstack'); out="altstack ok${nl}"; code=0},
            @{n='sig_ctx'; a=@('/bin/signals','ctx'); out="ctx ok${nl}"; code=0},
            @{n='sig_eintr'; a=@('/bin/signals','eintr'); out="eintr ok${nl}"; code=0},
            @{n='sig_child'; a=@('/bin/signals','child'); out="child ok${nl}"; code=0},
            @{n='sig_group'; a=@('/bin/signals','group'); out="group ok${nl}"; code=0},
            @{n='clocks'; a=@('/bin/clocks'); noout=$true; code=0},
            @{n='threads_static'; a=@('/bin/threads'); out="threads: counter=160000 idsum=28 main_tls=1${nl}"; code=0},
            @{n='threads_dyn'; a=@('/bin/threads_dyn'); out="threads: counter=160000 idsum=28 main_tls=1${nl}"; code=0},
            @{n='go_stress'; a=@('/bin/gostress'); out="gostress ok: ticks=20 sum=507500 spun=true procs=4${nl}"; code=0}
          )
          foreach ($t in $tcases) { $t.tar = $true }
          $cases += $tcases
          $cases += $known
          if ($env:ONLY) { $cases = @($cases | Where-Object { $_.n -match $env:ONLY }) }
          $fail = 0
          foreach ($leg in $env:LEGS -split '[, ]+' | Where-Object { $_ }) {
            Set-Leg $leg -KeepAvx512
            "##### leg $leg" | Tee-Object -Append -FilePath guests-$leg.txt
            foreach ($c in $cases) {
              $a = @("-code=$($c.code)", "-timeout=120s")
              if (-not $c.noout) { $a += "-check", "-out=$($c.out)" }
              if ($c.flags) { $a += $c.flags }
              if ($c.tar) { $a += "-tar=out/rootfs.tar"; $a += $c.a } else { $a += "out/$($c.n)" }
              $pass = 0
              for ($it = 0; $it -lt [int]$env:ITER; $it++) {
                "===== $($c.n)" | Tee-Object -Append -FilePath guests-$leg.txt
                & ./sentryguest.exe @a 2>&1 | Tee-Object -Append -FilePath guests-$leg.txt
                "exit: $LASTEXITCODE" | Tee-Object -Append -FilePath guests-$leg.txt
                if ($LASTEXITCODE -eq 0) { $pass++ } elseif (-not $c.known) { $fail = 1 }
              }
              if ([int]$env:ITER -gt 1) { "REPEAT $leg $($c.n): $pass of $($env:ITER) passed" | Tee-Object -Append -FilePath repeat.txt }
            }
          }
          exit $fail
      - name: Wait status diagnosis (repeated)
        if: always() && env.ITER != '1' && contains(env.ONLY, 'wait')
        continue-on-error: true
        shell: pwsh
        run: |
          # A killed background job must be reported as 143 by wait: many tries in one shell, then
          # whole runs with the Sentry's strace, keeping the failing ones.
          . tools/windows/ci/leg.ps1
          $loop = 'i=0; while [ $i -lt 200 ]; do sleep 30 & p=$!; kill $p; wait $p; s=$?; [ $s = 143 ] || echo "iter $i bg=$s"; i=$((i+1)); done 2>/dev/null; echo loop done'
          foreach ($leg in $env:LEGS -split '[, ]+' | Where-Object { $_ }) {
            Set-Leg $leg -KeepAvx512
            $o = & ./sentryguest.exe -sysmounts "-tar=out/rootfs.tar" "-timeout=300s" /bin/busybox sh -c $loop 2>&1 | Out-String
            "WAITLOOP $leg : $(@($o -split "`n" | Select-String 'iter \d+ bg=').Count) bad of 200, finished: $($o -match 'loop done'); $(($o -split "`n" | Select-String 'iter \d+ bg=' | Select-Object -First 5) -join ' / ')" | Tee-Object -Append -FilePath waitdiag.txt
            $bad = 0
            for ($i = 0; $i -lt [int]$env:ITER -and $bad -lt 3; $i++) {
              $o = & ./sentryguest.exe -strace -sysmounts "-tar=out/rootfs.tar" "-timeout=120s" /bin/busybox sh /t/wait.sh 2>&1 | Out-String
              if ($o -notmatch 'bg=143') {
                $bad++
                "WAITSTRACE $leg run $i failed: $(($o -split "`n" | Select-String '^bg=') -join ' ')" | Tee-Object -Append -FilePath waitdiag.txt
                $o | Out-File -Encoding utf8 "waitstrace-$leg-$i.txt"
              }
            }
            "WAITSTRACE $leg : $bad failed of $i" | Tee-Object -Append -FilePath waitdiag.txt
          }
      - name: vDSO without traps
        if: always() && (env.ONLY == '' || contains(env.ONLY, 'vdso'))
        shell: pwsh
        run: |
          # clock_gettime, gettimeofday, time and getcpu through the vDSO must not reach
          # the Sentry as system calls: the Sentry's counters may show only the guest's
          # own direct calls (test/guests/vdso.c).
          . tools/windows/ci/leg.ps1
          $fail = 0
          foreach ($leg in $env:LEGS -split '[, ]+' | Where-Object { $_ }) {
            Set-Leg $leg -KeepAvx512
            $o = & ./sentryguest.exe -profstats -timeout=120s out/vdso 2>&1 | Out-String
            "===== vdso $leg" | Tee-Object -Append -FilePath vdso.txt
            $o | Tee-Object -Append -FilePath vdso.txt
            if ($o -notmatch 'vdso ok' -or $o -notmatch 'direct syscalls: clock_gettime=(\d+) gettimeofday=(\d+) time=(\d+) getcpu=(\d+)') { "FAILED: vdso guest in leg $leg"; $fail = 1; continue }
            $direct = [ordered]@{clock_gettime=[int]$Matches[1]; gettimeofday=[int]$Matches[2]; time=[int]$Matches[3]; getcpu=[int]$Matches[4]}
            foreach ($k in $direct.Keys) {
              $n = 0
              if ($o -match "PROFSTATS $k +(\d+)") { $n = [int]$Matches[1] }
              if ($n -gt $direct[$k] + 10) { "FAILED: $k trapped $($n - $direct[$k]) times beyond the guest's $($direct[$k]) direct calls (leg $leg)"; $fail = 1 }
              else { "VDSO $leg ${k}: $n system calls, $($direct[$k]) of them direct" }
            }
            # Any other call that traps shows in the total (start-up makes about 20).
            $sum = 0; foreach ($v in $direct.Values) { $sum += $v }
            if ($o -match 'PROFSTATS syscalls: (\d+) calls' -and [int]$Matches[1] -gt $sum + 50) { "FAILED: $($Matches[1]) system calls in all, $sum of them direct (leg $leg)"; $fail = 1 }
          }
          exit $fail
      - name: Podman-shaped stress
        if: always() && env.ONLY == ''
        shell: pwsh
        run: |
          . tools/windows/ci/leg.ps1
          $fail = 0
          foreach ($leg in $env:LEGS -split '[, ]+' | Where-Object { $_ }) {
            Set-Leg $leg -KeepAvx512
            foreach ($pol in 'tokens', 'limit', 'always') {
              $env:WINSTUB_POLICY = $pol
              "===== $leg gopodman, spin policy $pol" | Tee-Object -Append -FilePath podman.txt
              $o = & ./sentryguest.exe "-tar=out/rootfs.tar" "-timeout=60s" /bin/gopodman 2>&1 | Out-String
              $o | Tee-Object -Append -FilePath podman.txt
              if ($o -notmatch 'gopodman ok' -or $LASTEXITCODE -ne 0) { "FAILED with policy $pol in leg $leg"; $fail = 1 }
            }
          }
          exit $fail
      - name: Hunt for hangs (limit policy)
        timeout-minutes: 15
        if: always() && env.ONLY == '' && contains(env.LEGS, 'native')
        continue-on-error: true
        shell: pwsh
        env: {WINSTUB_FSMODE: native, WINSTUB_POLICY: limit}
        run: |
          for ($i = 0; $i -lt 40; $i++) {
            $o = & ./sentryguest.exe "-tar=out/rootfs.tar" "-timeout=20s" /bin/gopodman 2>&1 | Out-String
            if ($o -notmatch 'gopodman ok') { "===== limit run $i hung or failed" | Tee-Object -Append -FilePath hang.txt; $o | Tee-Object -Append -FilePath hang.txt }
            else { "limit run $i ok" | Tee-Object -Append -FilePath hang.txt }
          }
      - name: Diagnose dlopen (debug log)
        if: always() && env.ONLY == ''
        continue-on-error: true
        env: {WINSTUB_DEBUG: "1"}
        shell: pwsh
        run: |
          . tools/windows/ci/leg.ps1
          foreach ($leg in $env:LEGS -split '[, ]+' | Where-Object { $_ -and $_ -ne 'native' }) {
            Set-Leg $leg -KeepAvx512
            "===== $leg" | Tee-Object -Append -FilePath diag.txt
            $o = & ./sentryguest.exe "-tar=out/rootfs.tar" "-timeout=60s" /bin/dlopen_glibc 2>&1 | Out-String
            $o -split "`n" | Where-Object { $_ -match 'fault|signal|unsupported|exception|illegal|unexpected' -and $_ -notmatch 'ud2 site' } | Select-Object -Last 150 | Tee-Object -Append -FilePath diag.txt
          }
      - name: Timing
        if: always() && env.ONLY == ''
        continue-on-error: true
        shell: pwsh
        run: |
          . tools/windows/ci/leg.ps1
          foreach ($leg in $env:LEGS -split '[, ]+' | Where-Object { $_ }) {
            Set-Leg $leg -KeepAvx512
            foreach ($n in "hello_asm","hello_glibc","fork_glibc","hello_go") {
              $t = @()
              for ($i = 0; $i -lt 9; $i++) {
                $o = & ./sentryguest.exe "-code=$(if ($n -eq 'hello_glibc') {7} else {0})" "out/$n" 2>&1 | Out-String
                if ($o -match 'run ([0-9.]+)(ms|s)') { $v = [double]$Matches[1]; if ($Matches[2] -eq 's') { $v *= 1000 }; $t += $v }
              }
              $t = $t | Sort-Object
              "TIMING $leg $n median $($t[4]) ms (min $($t[0]), max $($t[8])) all: $($t -join ' ')" | Tee-Object -Append -FilePath timing.txt
            }
          }
      - name: Timing, both modes on this machine
        if: always() && env.ONLY == '' && contains(env.LEGS, 'native')
        continue-on-error: true
        shell: pwsh
        env: {WINSTUB_FPMODE: ''}
        run: |
          foreach ($round in 1..2) {
          foreach ($m in 'native', 'rewrite') {
            $env:WINSTUB_FSMODE = $m
            foreach ($n in "hello_asm","hello_glibc","fork_glibc","hello_go") {
              $t = @()
              for ($i = 0; $i -lt 9; $i++) {
                $o = & ./sentryguest.exe "-code=$(if ($n -eq 'hello_glibc') {7} else {0})" "out/$n" 2>&1 | Out-String
                if ($o -match 'run ([0-9.]+)(ms|s)') { $v = [double]$Matches[1]; if ($Matches[2] -eq 's') { $v *= 1000 }; $t += $v }
              }
              $t = $t | Sort-Object
              "TIMING2 $m $n median $($t[4]) ms (min $($t[0]), max $($t[8]))" | Tee-Object -Append -FilePath timing.txt
            }
            $o = & ./sentryguest.exe "-tar=out/rootfs.tar" "-timeout=60s" /bin/gopodman 2>&1 | Out-String
            if ($o -match '(gopodman: \d+ syscall-level ops[^\n]*)') { "TIMING2 $m $($Matches[1])" | Tee-Object -Append -FilePath timing.txt }
            if ($o -match '(gopodman: 50 children[^\n]*)') { "TIMING2 $m $($Matches[1])" | Tee-Object -Append -FilePath timing.txt }
          }
          }
      - name: Trace
        if: always() && env.ONLY == '' && contains(env.LEGS, 'native')
        continue-on-error: true
        shell: pwsh
        env: {WINSTUB_TRACE: "1", WINSTUB_FSMODE: native, WINSTUB_FPMODE: ''}
        run: |
          foreach ($n in "hello_asm","hello_glibc","fork_glibc") {
            "===== trace $n" | Tee-Object -Append -FilePath trace.txt
            & ./sentryguest.exe "-sample" "-timeout=90s" "-code=$(if ($n -eq 'hello_glibc') {7} else {0})" "out/$n" 2>&1 | Tee-Object -Append -FilePath trace.txt
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sentry-guests-output
          path: |
            guests-*.txt
            trace.txt
            timing.txt
            podman.txt
            hang.txt
            diag.txt
            vdso.txt
            repeat.txt
            waitdiag.txt
            waitstrace-*.txt
          if-no-files-found: ignore
