# Podman acceptance on Windows: stock Windows podman client and docker CLI against Podman
# running in a runsc.exe sandbox, through a named pipe, as a standard user. Expected to fail at
# first; docs/results/5-podman-windows.md lists the gaps per step.
name: podman-windows
on:
  push:
    branches: [podman-windows-harness]
    paths: ["pkg/**", "runsc/**", "tools/windows/**", "test/e2e/podman-acceptance/**", ".github/workflows/podman-windows.yml"]
  workflow_dispatch:
env:
  PODMAN_VERSION: "5.3.1"
  DOCKER_VERSION: "27.3.1"
  COMPOSE_VERSION: "2.29.7"
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - name: Rootfs tar from the podman image
        run: |
          podman pull -q quay.io/podman/stable:v${PODMAN_VERSION}
          c=$(podman create quay.io/podman/stable:v${PODMAN_VERSION} sh)
          podman export "$c" | gzip -1 > rootfs.tar.gz
          ls -l rootfs.tar.gz
      - uses: actions/upload-artifact@v4
        with: {name: podman-rootfs, path: rootfs.tar.gz, compression-level: 0}
  acceptance:
    needs: image
    runs-on: windows-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod, cache: false}
      - uses: actions/download-artifact@v4
        with: {name: podman-rootfs, path: dl}
      - name: Build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force C:\ci\bin | Out-Null
          go build -p 2 -o C:\ci\bin\runsc.exe ./runsc
          go build -o C:\ci\bin\ttydrive.exe ./tools/windows/podman/ttydrive
      - name: Clients
        shell: pwsh
        run: |
          $t = 'C:\ci\tools'; New-Item -ItemType Directory -Force $t | Out-Null
          Invoke-WebRequest "https://github.com/containers/podman/releases/download/v$env:PODMAN_VERSION/podman-remote-release-windows_amd64.zip" -OutFile $t\podman.zip
          Expand-Archive $t\podman.zip $t\podman
          Invoke-WebRequest "https://download.docker.com/win/static/stable/x86_64/docker-$env:DOCKER_VERSION.zip" -OutFile $t\docker.zip
          Expand-Archive $t\docker.zip $t\docker
          # the compose plugin, found by the docker CLI next to its config
          New-Item -ItemType Directory -Force "$t\dockercfg\cli-plugins" | Out-Null
          Invoke-WebRequest "https://github.com/docker/compose/releases/download/v$env:COMPOSE_VERSION/docker-compose-windows-x86_64.exe" -OutFile "$t\dockercfg\cli-plugins\docker-compose.exe"
          Get-ChildItem -Recurse $t -Include podman.exe,docker.exe | ForEach-Object { $_.FullName; & $_.FullName --version }
      - name: Rootfs folder from the image
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force C:\ci\rootfs | Out-Null
          tar -xzf dl\rootfs.tar.gz -C C:\ci\rootfs 2>&1 | Select-Object -Last 20
          "extracted: $((Get-ChildItem C:\ci\rootfs).Count) top-level entries"
      - name: Acceptance as a standard user
        shell: pwsh
        continue-on-error: true
        run: |
          # The docker CLI looks for plugins in DOCKER_CONFIG/cli-plugins.
          New-Item -ItemType Directory -Force C:\ci\std | Out-Null
          & tools/windows/ci/run-as-standard-user.ps1 `
            -Program 'C:\Program Files\PowerShell\7\pwsh.exe' `
            -Arguments '-NoProfile','-File',"$PWD\tools\windows\podman\ci-run.ps1",'-Root','C:\ci' `
            -GrantPath C:\ci,$PWD -WritablePath C:\ci\std,C:\ci\rootfs -TimeoutSeconds 6000
      - name: Summary
        if: always()
        shell: pwsh
        run: |
          Get-Content C:\ci\std\results\steps.txt -ErrorAction SilentlyContinue
          Get-ChildItem C:\ci\std\engine\logs -ErrorAction SilentlyContinue | ForEach-Object { "--- $($_.Name)"; Get-Content $_.FullName -Tail 40 }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: podman-windows-logs
          path: |
            C:\ci\std\results
            C:\ci\std\engine\logs
