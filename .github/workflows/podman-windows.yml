# Podman acceptance on Windows: stock Windows podman client and docker CLI against Podman
# running in a runsc.exe sandbox, through a named pipe, as a standard user. Expected to fail at
# first; docs/results/5-podman-windows.md lists the gaps per step.
name: podman-windows
# Called by ci.yml on push (runs=1); nightly with runs=4 (flakiness). Dispatch it alone with
# `gh workflow run podman-windows --ref <branch> -f only=4 -f modes=native -f runs=1`.
on:
  workflow_call:
    inputs:
      prebuilt: {type: boolean, default: false}
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      only: {description: 'steps to run, e.g. 4 (default all)', default: ''}
      modes: {description: 'comma list of fs modes to compare: default, native, rewrite (rewrite also keeps AVX-512), rewrite-fxsave', default: 'default'}
      runs: {description: 'how many times to run the whole acceptance, in parallel (flakiness)', default: '1'}
concurrency:
  group: podman-windows-${{ github.ref }}-${{ inputs.prebuilt && 'ci' || github.event_name }}
  cancel-in-progress: true
env:
  PODMAN_VERSION: "6.2.0"
  DOCKER_VERSION: "27.3.1"
  COMPOSE_VERSION: "2.29.7"
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      runs: ${{ steps.p.outputs.runs }}
      modes: ${{ steps.p.outputs.modes }}
    steps:
      - id: p
        run: |
          n=${{ inputs.runs || (github.event_name == 'schedule' && 4 || 1) }}
          echo "modes=$(echo '${{ inputs.modes || 'default' }}' | sed 's/,/","/g; s/^/["/; s/$/"]/')" >> $GITHUB_OUTPUT
          echo "runs=$(seq -s, 1 $n | sed 's/^/[/; s/$/]/')" >> $GITHUB_OUTPUT
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The image depends only on the podman version and the harness files (bump v1 to rebuild).
      - uses: actions/cache@v4
        id: cache
        with:
          path: podman.erofs
          key: podman-erofs-v3-${{ env.PODMAN_VERSION }}-${{ hashFiles('test/e2e/podman-acceptance/harness/**') }}
      - name: Erofs image from the podman image
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq erofs-utils
          podman pull -q quay.io/podman/stable:v${PODMAN_VERSION}
          c=$(podman create quay.io/podman/stable:v${PODMAN_VERSION} sh)
          sudo rm -rf /tmp/root && mkdir /tmp/root
          podman export "$c" | sudo tar -x -C /tmp/root --numeric-owner --same-owner -p --xattrs --xattrs-include="*"
          # Engine settings baked into the read-only image (same files as the Linux harness; the
          # sqlite database goes to a tmpfs until sqlite works on a host folder, see the results).
          h=test/e2e/podman-acceptance/harness
          sudo mkdir -p /tmp/root/etc/containers /tmp/root/run /tmp/root/tmp /tmp/root/var/lib/containers
          sudo cp $h/containers.conf /tmp/root/etc/containers/containers.conf
          sudo sed 's/^driver = .*/driver = "vfs"/' $h/storage.conf | sudo tee /tmp/root/etc/containers/storage.conf >/dev/null
          # Marker that makes Podman ask the gateway to expose published ports (libpod/networking_machine.go);
          # the windows-nat gateway answers at gateway.containers.internal (10.0.2.2:80).
          echo qemu | sudo tee /tmp/root/etc/containers/podman-machine >/dev/null
          echo "10.0.2.2 gateway.containers.internal host.containers.internal" | sudo tee -a /tmp/root/etc/hosts >/dev/null
          echo "nameserver 10.0.2.3" | sudo tee /tmp/root/etc/resolv.conf >/dev/null
          sudo mkfs.erofs -b 4096 -T 0 podman.erofs /tmp/root >/dev/null
          ls -l podman.erofs
      - uses: actions/upload-artifact@v4
        with: {name: podman-rootfs, path: podman.erofs, compression-level: 0}
  acceptance:
    needs: [image, plan]
    strategy:
      fail-fast: false
      matrix:
        run: ${{ fromJSON(needs.plan.outputs.runs) }}
        mode: ${{ fromJSON(needs.plan.outputs.modes) }}
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {name: podman-rootfs, path: dl}
      - uses: ./.github/actions/winbin
        with: {prebuilt: "${{ inputs.prebuilt }}", targets: "runsc,ttydrive"}
      - name: Clients
        shell: pwsh
        run: |
          $t = 'C:\ci\tools'; New-Item -ItemType Directory -Force $t | Out-Null
          Invoke-WebRequest "https://github.com/containers/podman/releases/download/v$env:PODMAN_VERSION/podman-remote-release-windows_amd64.zip" -OutFile $t\podman.zip
          Expand-Archive $t\podman.zip $t\podman
          Invoke-WebRequest "https://download.docker.com/win/static/stable/x86_64/docker-$env:DOCKER_VERSION.zip" -OutFile $t\docker.zip
          Expand-Archive $t\docker.zip $t\docker
          # the compose plugin, found by the docker CLI next to its config
          New-Item -ItemType Directory -Force "$t\dockercfg\cli-plugins" | Out-Null
          Invoke-WebRequest "https://github.com/docker/compose/releases/download/v$env:COMPOSE_VERSION/docker-compose-windows-x86_64.exe" -OutFile "$t\dockercfg\cli-plugins\docker-compose.exe"
          Get-ChildItem -Recurse $t -Include podman.exe,docker.exe | ForEach-Object { $_.FullName; & $_.FullName --version }
      - name: Acceptance as a standard user
        shell: pwsh
        continue-on-error: true
        run: |
          New-Item -ItemType Directory -Force C:\ci\std | Out-Null
          Copy-Item dl\podman.erofs C:\ci\podman.erofs
          icacls C:\ci /grant 'Users:(OI)(CI)M' /Q
          New-Item -ItemType Directory -Force C:\ci\std | Out-Null
          New-Item -ItemType Directory -Force C:\ci\std\engine\storage | Out-Null
          & tools/windows/ci/run-as-standard-user.ps1 `
            -Program 'C:\Program Files\PowerShell\7\pwsh.exe' `
            -Arguments '-NoProfile','-File',"$PWD\tools\windows\podman\ci-run.ps1",'-Root','C:\ci','-Only','${{ inputs.only || 'all' }}','-FsMode','${{ matrix.mode }}' `
            -GrantPath C:\ci\bin,C:\ci\tools,$PWD -WritablePath C:\ci\std -TimeoutSeconds 2400
      - name: Steps that must pass (grows with every fixed step)
        shell: pwsh
        run: |
          $only = '${{ inputs.only }}'
          # Step 5 (build-apt) is required in native and, since the heap fix (docs/results/1p-rewrite-heap.md), rewrite
          # modes; in default mode it still failed in ci run 45979763597.
          $all = if ('${{ matrix.mode }}' -ne 'default') { 1..10 } else { 1, 2, 3, 4, 6, 7, 8, 9, 10 }
          $must = $all | Where-Object { -not $only -or ($only -split '[, ]+') -contains "$_" }
          $t = Get-Content -Raw C:\ci\std\results\steps.txt
          $bad = $must | Where-Object { $t -notmatch "(?m)^STEP $_ PASS" }
          if ($bad) { "required steps failed: $bad"; exit 1 }
      - name: Summary
        if: always()
        shell: pwsh
        run: |
          Get-Content C:\ci\std\results\steps.txt -ErrorAction SilentlyContinue
          Get-ChildItem C:\ci\std\engine\logs -ErrorAction SilentlyContinue | ForEach-Object { "--- $($_.Name)"; Get-Content $_.FullName -Tail 40 }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: podman-windows-logs-${{ matrix.mode }}-${{ matrix.run }}
          path: |
            C:\ci\std\results
            C:\ci\std\engine\logs
