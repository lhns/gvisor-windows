# Native kernel overlay (no fuse-overlayfs: its FUSE daemon dies inside the sandbox with
# "transport endpoint is not connected"). STORAGE_DRIVER=vfs in the environment overrides this.
[storage]
driver = "overlay"
runroot = "/run/containers/storage"
graphroot = "/var/lib/containers/storage"
additionalimagestores = []
[storage.options.overlay]
mount_program = ""
